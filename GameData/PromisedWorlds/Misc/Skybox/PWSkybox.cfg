@SigmaReplacements:HAS[@PromisedWorldsSettings:HAS[~Skybox[?alse]]]:FOR[PromisedWorlds]
{
    SkyBox
    {
        CubeMap
        {
            mirror = false
            rotate = false
            SkyBox = PromisedWorlds/Misc/Skybox/TextureReplacer/Default/GalaxyTex
        }
    }
}

@TextureReplacerReplaced:FOR[PromisedWorlds]:HAS[@PromisedWorldsSettings:HAS[~Skybox[?alse]]]
{
    %Folders
    {
        Default = PromisedWorlds/Misc/Skybox/TextureReplacer/Default/
    }
}

@DiRT_Config:FOR[PromisedWorlds]:HAS[@PromisedWorldsSettings:HAS[~Skybox[?alse]]]
{
    %TextureFolder = PromisedWorlds/Misc/Skybox/TextureReplacer/Default/
}
