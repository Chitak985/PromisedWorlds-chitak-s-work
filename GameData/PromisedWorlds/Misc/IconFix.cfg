// Patch is intended for compatibility with KSS2, considering its alternative style of Star icons and the number of stars it has. Keep PW Planet icons as they are fitting.

@Kopernicus:AFTER[PromisedWorlds]:NEEDS[KSS2]
{
	@Body[Debdeb]
	{
		@Orbit
		{
			@iconTexture = KSS2/Core/Configs/Icons/proto
		}
	}
}
@Kopernicus:AFTER[PromisedWorlds]:NEEDS[KSS2]
{
	@Body[Tuun]
	{
		@Orbit
		{
			@iconTexture = KSS2/Core/Configs/Icons/star
		}
	}
}
