        #LOC_PW_sci_crewReport_NojSrfLandedFluffyHills = Your craft sinks slightly into the mound of accreted ring dust. You can see the rings, the horizon, and maybe even your house from here.
        #LOC_PW_sci_crewReport_NojSrfLandedEquator = Your craft sinks slightly into the mound of accreted ring dust. You can see the lowlands, midlands, highlands, and maybe even your house from here.
        #LOC_PW_sci_crewReport_NojInSpaceLow = Careful--that equatorial ridge means business!
        #LOC_PW_sci_crewReport_NojInSpaceHigh = On Kerbin, Noj is a famous brand of ice cream sandwich made from ground-up Minmus dust. You can see the resemblance.

