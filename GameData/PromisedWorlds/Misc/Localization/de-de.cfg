        #LOC_PW_sci_crewReport_PufSrfLanded = The craft sags into the light, puffy ground, like boots on dry soil.
        #LOC_PW_sci_crewReport_PufSplashed = You are floating on the deepest ocean ever discovered by kerbalkind. The thought of going outside vexes you.
