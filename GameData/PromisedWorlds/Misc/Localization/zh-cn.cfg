        // ******** Debdeb Descriptions ********

        #LOC_PW_desc_Debdeb = Debdeb是一颗K型恒星，比Kerbol稍大一些。从宇宙的时间尺度上来说，它只是一颗婴儿恒星。一千万年前，一片巨大而寒冷的气体和尘埃云由于引力作用形成了这颗恒星。环绕它的原行星盘含有孕育新生行星的原料，其中诞生了六颗年轻的年轻行星，每一颗都有引人入胜的故事。\n\nDebdeb会猛烈地向外抛射星际物质。记得多带点防晒霜。
        #LOC_PW_desc_Charr = 你喜欢晒太阳浴吗？Charr会是你的新挚友。这块饱受轰击的铁疙瘩紧挨着 Debdeb，因高温而发出明亮的红光。尽管它比Kerbin小一些，但是它超大质量使其地表重力加速度几乎是Kerbin的两倍！这里可能蕴藏着大量的稀有金属和材料，非常适合建造飞船。\n\nCharr收集并散发着大量的热量。请制定好相应计划并谨慎飞行。
        #LOC_PW_desc_Ovin = Ovin是一颗恐怖的行星，其上有令人窒息的大气、破碎的表面以及能将你撕成碎片的重力。我们尚不可知这样的星球到底是如何形成的。关于它的一切都违背了我们对类地行星的认知。这颗行星的发现给诸多科学家带来了数周的噩梦。\n\n当然，这不会阻止我们把小绿人送到那里去。从地面上看，那些圆环一定是极为壮观的景象。
        #LOC_PW_desc_Gurdamma = Gurdamma上饱受轰炸的地表、快速的自转以及那颗距离它非常近的卫星证明在并不遥远的过去曾发生过一场巨大的撞击事件。凭借这一点再加上它的体积和质量，意味着这颗年轻的行星让我们得以一窥早期的Kerbin可能是什么样子。Gurdamma因受到其最大的卫星Donk的潮汐力影响，产生了巨大的潮汐波和极端的全球性火山活动。这些火山喷发的烟柱高耸入云，这也是从太空观测这颗行星时最为显著的特征之一。
        #LOC_PW_desc_Donk = Donk是一颗诞生于Gurdamma星环之中的年轻卫星。它紧邻Gurdamma，这使得它不断被潮汐力挤压拉伸，得以让我们一窥其地幔的景象。此外，Donk还有一个临时存在的稀薄大气层，肆虐的太阳风正不断将其从Donk表面剥离吹向深空。\n\nDonk的命名是通过公众投票决定的，如今它成了一个坏榜样，警示我们下次还是不要这么做了。
        #LOC_PW_desc_KevbasAnomalyA = 在坎巴拉星系中出现了一颗神秘的虫洞。我们不知道它是怎么到这里来的，以及它的目的是什么……但是为什么不利用这个廉价星际旅行的机会呢？
        #LOC_PW_desc_KevbasAnomalyA_RSS = 在太阳系中出现了一颗神秘的虫洞。我们不知道它是怎么到这里来的，以及它的目的是什么……但是为什么不利用这个廉价星际旅行的机会呢？
        #LOC_PW_desc_KevbasAnomalyB = Debdeb星系的入口，同时这里也拥有令人惊叹的景色！
        #LOC_PW_desc_Gup = 这个小硬块被抛入了一个遥远的椭圆轨道，它看起来像是近期Donk受到撞击时产生的。它自转得非常快，这使它被甩成了盘状。\n\n这也使着陆其赤道附近将变得异常艰难。记得带上地锚！
        #LOC_PW_desc_Lapat = Lapat浓厚的二氧化碳将其笼罩在一层诡异的幕布之中。透过烟雾，我们勉强能辨认出白沙丘之间点点泛着泡沫的水。Lapat最显著的特征是其巨大的平顶山，它们高耸入云，摆脱了底部周围浑浊的环境。其附近有大量的矿物隐匿在烟雾缭绕的天空之下。\n\n如果你喜欢炎热的夏日，那么Lapat就是个好去处！除非你还喜欢像罐头一样被挤扁……凡事都有两面性嘛。
        #LOC_PW_desc_Axod = 以至于其半球伴随着时间推移发生了偏移，形成了其独特的形状和坎星人见过最高的悬崖。我们希望将坎星最顶尖的极限运动达人带到这里，让他们以Axod纤细的星环以及其小卫星Umod作为背景表演一些疯狂的特技。
        #LOC_PW_desc_Umod = Umod遍布战斗的伤痕。这颗破碎的卫星在经历了一段狂暴的过去后，正努力重新拼凑自己。尽管它的凹痕和褶皱与它的母体相比不值一提，但那些漩涡状的图案和参差不齐的山脉却使其别具一格。\n\n奇怪的是，它看起来竟让人垂涎欲滴……
        #LOC_PW_desc_Dorau = 神秘的Dorau潜伏在Debdeb外围的乌云之中。这颗冰巨星的大气中富含甲烷，使其呈现出壮丽的的海蓝色。超音速风速造就了这里的壮观景象。赤道周围有巨大的风暴，这些风暴源于Bis被捕获后，其原有卫星陷入混乱而引发的撞击事件。\n\n如果你眼神足够好，你或许会发现它那暗淡的光环。
        #LOC_PW_desc_Bis = 这颗冰球因其皱巴巴的哈密瓜状地形和类似酥脆冰饼干的峡谷而得名。其地壳由氨、水和氮冰构成，下方隐藏着液态海洋。这片海洋引发了剧烈的冰火山活动，导致表面出现喷发和深红色的痕迹，尤其是在峡谷内部。巨大的撞击形成了平坦的平原，这让你不禁想起Minmus。\n\n当你去参观Bis时，试着留意一下它那稀薄的大气层。

        // ******** Tuun Descriptions ********

        #LOC_PW_desc_Tuun = 更大、更亮、更热、更重，这些是F级主序星Tuun的代名词。它是坎星夜空中最亮的恒星。其宜居带非常广阔，这意味着这个恒星系统比坎巴拉星系拥有更多存在生命的可能性！\n\n谁知道呢？或许你随便翻开一块石头都能发现一个超级迷你版的航天中心。
        #LOC_PW_desc_RaskRuskBarycenter = 你从未见过这样的兄弟之争！炽热的双胞胎行星Rask和Rusk诞生于它们巨大的原行星母体。母体一分为二之后，这两颗行星就陷入了无穷无尽的毁灭性漩涡之中。它们巨大的引力以及彼此间的极近距离意味着它们正在缓慢地将对方撕裂。\n\n在这对行星附近飞行时一定要小心，免得被卷入交叉火力之中！
        #LOC_PW_desc_Rask = Rask是这对孪生星球中更大、更强的一个。由于潮汐力的影响减弱，被牵引到地表的熔岩较少。这里的地壳由岩石构成，在应力作用下容易开裂，从而在整个星球上形成宽阔的裂缝。\n\n这种潮汐作用会形成山脊和峡谷，让着陆变得异常艰难（如果本来就不难的话）。记得多带点燃料。
        #LOC_PW_desc_Rusk = Rusk是Rask遭受重创的胞弟。内部的岩浆海洋在潮汐力的作用下被吸引到地表，形成了一个巨大的熔岩海洋，覆盖了这颗行星面向Rask的一侧。巨大的岩石尖塔耸入天空达数千米，遍布在这片熔融的海洋中。\n\n小一些的岩浆湖分布在行星另一侧，为那些怕冷的坎星人打造了一处完美的度假胜地。
        #LOC_PW_desc_Puf = 当我们第一次观测Puf时，看到它正直勾勾地 “回望” 我们，我们都惊呆了。那片类似瞳孔的海洋并非普通的海洋，而是我们见过的最深的海洋，向下延伸超过 100 公里深嵌进地表。这种深度很可能是由一颗小行星穿透Puf低密度的表面形成的。稀薄的甲烷大气层和异常低的重力使它成为一个相对容易抵达的目的地。只是要小心别反弹回轨道。\n\n我们不知道怎么描述，但这颗行星总有些让人不安的地方。它透过镜头注视你的样子。或许藏着什么秘密。
        #LOC_PW_desc_BorgalsAnomalyA = 直到最近，坎星科学家还认为Dres只是个传说。现在，他们表示还在它周围发现了一个虫洞！
        #LOC_PW_desc_BorgalsAnomalyA_Debdeb = 我们发现在Dorau轨道附近游荡的天体实际上是一个虫洞。要弄清楚它通向哪里真的只有一个办法！
        #LOC_PW_desc_BorgalsAnomalyA_RSS = 太阳系内新发现了一个奇怪的虫洞，它会通向哪里呢？
        #LOC_PW_desc_BorgalsAnomalyB = 这个虫洞是从这里回去最快的途径。
        #LOC_PW_desc_Glumo = 神奇的Glumo确实是独一无二的。在标志性的光环和色彩斑斓的卫星这一点上，没有哪个地方能像它这般令人惊叹。它以 独特的63度轴向倾斜侧身旋转。其气态外层含有水、氨和硫氢化铵冰，这些物质会随着季节的变化以不同方式与光线相互作用，从而导致极端的颜色变化。因此，天文学家曾多次将它误认为是一颗完全不同的行星！\n\n穿过这些环的时候要小心，避免被碎片压扁、搅成泥或者切成丝。
        #LOC_PW_desc_Noj = Noj是一颗孤独的牧羊人卫星，它是由环绕在Glumo星环系统中的冰和其他各种微不足道的物质积聚形成的。灰尘在冰面上留下污渍，在其表面形成了可爱的彩色斑点。\n\n暂且不说这些漂亮的颜色，科学家们对来自Noj的初步读数赞不绝口，他们还想要更多的数据，前提是我们得先到达那里。
        #LOC_PW_desc_Merbel = Merbel的美学风格与其他天体截然不同。在它两个巨大的冰盖之间覆盖着一片醒目的甲烷和氨的海洋。其惊人的自转速度和低倾角使赤道接受了来自Tuun的大量能量。当你看到厚实的蓝色腰带成为下一个重大时尚潮流时，你就会知道是哪个冰爽的标志性天体激发了这一灵感！\n\nMerbel的轨道平面和Glumo的赤道平面完全不共面，这表明它曾经是一颗行星，后来被Glumo捕获。其他卫星可能因此变得不稳定，这或许造就了Glumo标志性的光环！

