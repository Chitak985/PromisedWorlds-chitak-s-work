        // -------------------- Charr --------------------

        #LOC_PW_sci_crewReport_CharrSrfLandedMoltenCraters = 这并不理想。
        #LOC_PW_sci_crewReport_CharrSrfLandedScorchedCraters = 你不确定自己是怎么着陆在这里的。或许最好不要停留太久。
        #LOC_PW_sci_crewReport_CharrSrfLandedHotCraters = 你惊叹于那炽热的火山口中心。与此同时，你的飞船像被微波炉加热过的黄油塔一样，渐渐融化进地面。
        #LOC_PW_sci_crewReport_CharrSrfLandedCraters = 你被强大的引力压回到座位上。
        #LOC_PW_sci_crewReport_CharrSrfLandedMetallicPlains = 炽热的铁带顺着无尽的陨石坑流淌，汇入它们柔软、黏糊糊的中心。你真希望坎巴拉星系也有一颗如此壮丽的熔岩行星（抱歉了，Moho）。
        #LOC_PW_sci_crewReport_CharrSrfLandedRockyMountains = 一片火海越过地平线，消失在视线之外。真是一幅壮丽的景象。
        #LOC_PW_sci_crewReport_CharrSrfLandedPlateaus = 这艘飞船在强重力下微微发出呻吟声。
        #LOC_PW_sci_crewReport_CharrSrfLandedNorthernCrater = 这块岩石已被炸开，露出了下面的金属。
        #LOC_PW_sci_crewReport_CharrSrfLandedNorthernCraterRays = 细长的条纹从巨大的陨石坑中延伸出来。你想起了Mun上那些有辐射纹的陨石坑。
