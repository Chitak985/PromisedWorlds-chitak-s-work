        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineOceans = 如果这不是一项伟大的星际探索壮举，那么这里或许就会是那些关于失踪探险家的纪录片中所提及的那种地方。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineTrenches = Gurdamma强烈的地震活动造就了深邃的海沟；在坎星可没有这样的景象！
