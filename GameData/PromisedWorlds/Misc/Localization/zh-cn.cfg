        #LOC_PW_sci_crewReport_CharrInSpaceHigh = 表面布满凹坑、红肿且发炎——这是一例严重的太空痤疮。

        // -------------------- Ovin --------------------

        #LOC_PW_sci_crewReport_OvinSrfLandedValleys = 在这么强的引力下做任何事情都很困难，哪怕呼吸也极其艰难。
        #LOC_PW_sci_crewReport_OvinSrfLandedDivets = 从这里往下看，那些星环更令人印象深刻。不过，这一切努力都不值得。
        #LOC_PW_sci_crewReport_OvinSrfLandedCrushlands = 你深陷Ovin的引力井中——也就是说，这里将是你飞船永远的新家。
        #LOC_PW_sci_crewReport_OvinSrfLandedFlats = 地面已经被粉碎成一片无边无际的沙地、尘埃以及其他一些又小又略呈扁平状的东西。
        #LOC_PW_sci_crewReport_OvinSrfLandedHighlands = 你惊叹于被重力抚平的地貌断裂着延伸至未知之处。那是一种美丽的荒芜。
        #LOC_PW_sci_crewReport_OvinSrfLandedHills = Ovin是如何在如此巨大的压力下拥有山脉的，这对你来说是个谜。你打算如何离开，这同样是个谜。
        #LOC_PW_sci_crewReport_OvinSrfLandedNedzerfjord = 内泽尔峡湾是以著名坎星人内泽尔·科尔曼的名字命名的，他因为试图携带过多零食，导致腿部被零食的重力压碎而身亡。
        #LOC_PW_sci_crewReport_OvinSrfLandedValleyofDespair = 欢迎来到绝望之谷，之所以叫这个名字，是因为……唉，你自己看看就知道了。
        #LOC_PW_sci_crewReport_OvinSrfLandedDustyCrater = 宇宙飞船略微陷入了陨石坑松软的土壤中，这让你不禁想知道，如果Ovin上有流沙会发生什么。希望这里没有流沙。
        #LOC_PW_sci_crewReport_OvinSrfLandedGreatRift = 北方大裂谷是一个块巨型离散型板块的边界，地幔中的熔岩上升并冷却，形成了这些山丘和裂缝。
        #LOC_PW_sci_crewReport_OvinSrfLandedGreatRiftDivergence = 你正处于Debdeb星系中最危险的地震区域的正中央。这太令人不安了。
        #LOC_PW_sci_crewReport_OvinFlyingLow = 你努力在极端重力下保持飞船完好无损。与此同时，重力却对你微不足道的努力嗤之以鼻。
        #LOC_PW_sci_crewReport_OvinFlyingHigh = 大气层包裹着你的飞船，并试图将其向下拉。就在不远处的下方，Ovin那光滑如柚木般的表面散发着诱人的吸引力。
        #LOC_PW_sci_crewReport_OvinInSpaceLow = Ovin的表面平坦得像煎饼一样。如果你继续往下走，你也会变得跟煎饼一样平。
        #LOC_PW_sci_crewReport_OvinInSpaceHigh = Ovin是古代坎巴拉神话中的智慧与耄耋之神。根据你的旅行偏好来看，你似乎两者都不想要。

        // -------------------- Gurdamma --------------------

        #LOC_PW_sci_crewReport_GurdammaSrfLandedAbyssalOceans = 你现在在水下，处于一种极度困惑的状态。你真希望在下来之前没有把剩下的苏打水都一饮而尽。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedDeepOceans = 你的飞船在巨大的压力下发出呻吟。你应该明白这是《坎巴拉太空计划》，而不是《坎巴拉潜艇计划》，对吧？
        #LOC_PW_sci_crewReport_GurdammaSrfLandedOceans = 这里的海底太贫瘠了。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShallows = 附近惊涛拍岸，比你在老家见过的都要猛烈。由于Donk离得非常近，加上动荡的大气环境，使得这里的海浪变得相当大。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShores = 想象一下，把好几吨马尾藻、臭鸡蛋和熏火腿放进搅拌机里搅拌，然后放在外面晾一个星期。我们现在的处境就是这样。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedLowlands = 地面潮湿且多沙。岩石露头和一片片矿物质一直延伸到地平线。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMidlands = 你感觉自己仿佛回到了家，迷失在坎星的一片沙漠中。但是头顶巨大的卫星和星环提醒着你，这颗星球实际上是多么的陌生。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedHighlands = 飞船的舱壁上凝结了水汽。幸运的是，我们所有的太空部件都经过精心设计，不会生锈。要是那些计划外的解体也能如此就好了……
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMountains = 当你从最高的观景处欣赏Gurdamma时，浓汤般的云朵在洒满阳光的天空中蜿蜒飘荡。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAlpineMountains = 附近火山喷发的白色火山灰在这些山脉的山坡上慢慢凝结。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPeaks = Gurdamma那蜿蜒的陨石坑和火山山脉构成了一幅壮丽的景象！
        #LOC_PW_sci_crewReport_GurdammaSrfLandedVolcanoes = 当你凝视着那座冒着浓烟的火山口时，那座冒着浓烟的火山口也在凝视着你。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedVolcanoCraters = 制造商的保修范围当然不包括火山环境暴露的情况。法务部门明确表示，将“暴露在火山环境中”纳入保修是绝对不行的。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMountBogue = 博格山是以著名的坎巴拉视频博主博格・科尔巴克（Bogue Kerbark）的名字命名的。据说这座山的高度与他的订阅者数量相当。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenCoasts = 附近活火山的烟柱上掉落的松散火山灰散落了你周围的地面。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenLowlands = 火山灰散落在带有侵蚀痕迹的岩石上，就像调料撒在一块非常干的披萨饼皮上一样。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenHighlands = 火山灰在高地的风中盘旋。一个小小的火山灰卷风蜿蜒着经过飞船，随后消散在灰色的烟雾中。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenMountains = 烟雾飘过飞船，有可能堵塞上面的仪器。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenAlpineMountains = 烟雾飘过飞船，有可能堵塞上面的仪器。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenPeaks = 这里的火山灰沉降得很快。山体向下延伸，消失在视线之外，被浑浊的云层遮蔽，这段下山的路很长。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPoles = 外面的空气更清新，因为大多数火山都更靠近赤道。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPolarSeas = 和坎星的极地不同，Gurdamma的极低几乎无法让人从其酷热中得到一丝喘息。要不是因为大气压力，水早就沸腾了！
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShankastRiver = 啊……多么宁静的地方啊！不过，这里有巨大的原行星盘、正在活跃形成的卫星，还有剧烈的火山活动。或许这里终究还是不那么宁静……
        #LOC_PW_sci_crewReport_GurdammaSrfLandedTealRiver = 这里风平浪静。暂时摆脱了这个星球其他地方的种种挑战。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMylonRiver = 麦伦河得名于制造坎巴拉太空服所用的那种飘逸面料，它是一条美丽却散发着异味的水道。
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlines = 作为一颗和原始坎星相似的大陆行星，Gurdamma存在地壳活动这件事对你来说并不奇怪。你只希望这种活动不会偏偏在现在发生。
