        #LOC_PW_sci_crewReport_GurdammaSplashedOceans = 这艘船被Gurdamma的巨浪摇晃得左右摇摆。
        #LOC_PW_sci_crewReport_GurdammaSplashedShallows = 你离海岸越来越近了，或许会一路走到那里，去看看那片仿佛许久未见的陆地。
        #LOC_PW_sci_crewReport_GurdammaSplashedShores = 附近惊涛拍岸，比你在老家见过的都要猛烈。由于Donk离得非常近，加上动荡的大气环境，使得这里的海浪变得相当大。
        #LOC_PW_sci_crewReport_GurdammaSplashedAshenCoasts = 水不再仅仅是有臭味，还含有一层来自Gurdamma火山的薄薄火山灰。
        #LOC_PW_sci_crewReport_GurdammaSplashedPolarSeas = 从这些高纬度地区，你可以看到行星环、原行星盘以及所有一切。
        #LOC_PW_sci_crewReport_GurdammaSplashedShankastRiver = 河水湍急，但原行星盘和Donk的景象让这次河上巡游非常值得！
        #LOC_PW_sci_crewReport_GurdammaSplashedTealRiver = 你想象着乘上一只小船来到河上，让流水带着你远去。
