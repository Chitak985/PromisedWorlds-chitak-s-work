        // ******** Debdeb Descriptions ********

        #LOC_PW_desc_Debdeb = Debdeb is a K-type star, a little larger than Kerbol. On the cosmic timescale, Debdeb is only a baby. 10 million years ago, a large cold cloud of gas and dust collapsed due to gravity, forming this star. Surrounding it is a proto-planetary disk containing the ingredients for new planets. Within this disk orbits 6 young planets, each with gripping stories to tell. \n\nDebdeb tends to eject stellar material violently. Pack lots of sunscreen.
        #LOC_PW_desc_Charr = Do you love sunbathing? Charr is your new best friend. This bombarded hunk of iron is snuggled up right next to Debdeb, glowing bright red from the heat. Despite being smaller than Kerbin, its mighty density gives it almost twice the gravity of Kerbin! There's likely an abundance of rare metals and materials here, perfect for building ships. \n\nCharr collects and disperses an immense amount of heat. Plan accordingly and fly carefully.
        #LOC_PW_desc_Ovin = A choked atmosphere, a shattered surface and gravity that will tear you to shreds. Ovin is terrifying. We don't know how a planet like it could form. Everything about it defies our understanding of terrestrial planets. Its discovery gave many scientists nightmares for weeks afterwards. \n\nNone of this will stop us from sending kerbals there of course. Those rings must be a superb sight from the ground.
        #LOC_PW_desc_Gurdamma = Gurdamma's bombarded surface, rapid spin and large close moon are evidence of a massive collision in the recent past. This along with its size and mass means that this young planet offers a glimpse at what early Kerbin may have looked like. \n\nTidal forces exerted on Gurdamma from its largest moon, Donk, create giant tidal waves and extreme global volcanism. The plumes from these volcanoes reach high into the atmosphere and are one of the most prominent features when the planet is viewed from space.
        #LOC_PW_desc_Donk = Donk is a young moon forming between the rings of Gurdamma. Its close proximity to Gurdamma means it is constantly being squeezed and stretched, causing massive tears to open in the crust, giving us a view into the mantle. There is also a thin, temporary atmosphere that is getting blown into space by the solar wind. \n\nDonk was allowed to be named by a public vote and is now a permanent reminder to never do that again.
        #LOC_PW_desc_KevbasAnomalyA = A mysterious wormhole discovered in the Kerbolar system. We're not sure how it got there or what its purpose is... but why not capitalise on the opportunity for cheap interstellar travel?
        #LOC_PW_desc_KevbasAnomalyA_RSS = A mysterious wormhole discovered in the Solar system. We're not sure how it got there or what its purpose is... but why not capitalise on the opportunity for cheap interstellar travel?
        #LOC_PW_desc_KevbasAnomalyB = The entrance to the Debdeb system, with a stunning view!
        #LOC_PW_desc_Gup = This little nugget was flung into a far elliptical orbit, likely after the recent collision that formed Donk. It spins very fast which has flattened it into a disk shape. \n\nLanding around the equator is extremely difficult thanks to this spin. Remember to bring ground anchors!
        #LOC_PW_desc_Lapat = Lapat's thick carbon dioxide wraps it in an eerie shroud. Through the smog, we can just about make out dots of foamy water amongst dunes of white sand. Lapat's most striking features are its great mesas that climb high into the sky, escaping the soupy environment around their bases. Mineral deposits are scattered nearby, hidden away by the smoggy sky. \n\nIf you fancy a hot summer day then Lapat is the place! Unless you also fancy being crushed like a can..... Pluses and minuses.
        #LOC_PW_desc_Axod = The skewed Axod spins so fast that its hemispheres have offset, creating the highest cliffs Kerbalkind has ever seen. It isn't big enough to clear a path through the protoplanetary disk, so we call it a dwarf planet. It still tries to grab debris from the disk and has decorated itself with some fancy rings. \n\nWe're hoping to transport our most extreme sports personalities, including Flamin' Fredricka Kerman, over to Axod to perform some insane stunts.
        #LOC_PW_desc_Umod = Umod bears many battle scars. This shattered moon is putting itself back together after a violent past. While its divets and folds don't hold a flame to its parent body, the swirling patterns and jagged mountains make it stand out. \n\nIt's oddly delicious looking...
        #LOC_PW_desc_Dorau = The mystical Dorau lurks amongst the dark clouds of the outer Debdeb system. This ice giant has lots of methane in its atmosphere, turning it sea blue. Supersonic wind speeds create the drama here, with large storms around the equator, seeded by impact events after the capturing of Bis sent its former moons into chaos. \n\nIf you have a good eye, you might spot its faint rings.
        #LOC_PW_desc_Bis = This ball of ice was named for its crinkly cantaloupe terrain and canyons resembling a crunchy ice biscuit. The crust, made of ammonia, water, and nitrogen ice, conceals the liquid ocean beneath. This ocean causes extreme cryovolcanism leading to eruptions and crimson stains across the surface, especially inside of the canyons. Large impacts have formed flat planitia, reminding you of Minmus. \n\nWhen you visit Bis, try to spot its thin atmosphere.

        // ******** Tuun Descriptions ********

        #LOC_PW_desc_Tuun = Bigger, brighter, hotter, mass-ier (???): Tuun is an F-type main-sequence star, and is the brightest star in Kerbin's night sky. Its Goldilocks zone is massive, meaning this star system has more potential for life than the Kerbolar system! \n\nWho knows? Maybe you'll turn over a rock and find a teeny-tiny space center.
        #LOC_PW_desc_RaskRuskBarycenter = You've never seen siblings fight like this! The fiery twins Rask and Rusk were born after their gargantuan parent proto-planet was split in half, leaving two planets now trapped in an endless destructive spiral. Their immense gravity and proximity means they are slowly ripping each other apart. \n\nBe careful when flying near this pair, lest you be caught in the crossfire!
        #LOC_PW_desc_Rask = Rask is the larger and stronger of the binary pair. Less lava is pulled to the surface here due to the decreased impact of tidal forces. The crust here is rocky and easily cracks under the stress forming wide cracks across the planet. \n\nThis tidal action creates ridges and canyons to form, making landing difficult (if it wasn't already). Pack some extra fuel!
        #LOC_PW_desc_Rusk = Rusk is Rask's smaller twin and is taking a massive beating. The inner magma oceans are drawn to the surface by tidal forces, creating a huge lava ocean that covers the Rask-facing side of the planet. Huge rock spires, reaching several kilometres into the sky, populate the molten ocean. \n\nSmaller lava lakes are scattered around the other side, creating the perfect getaway destination for kerbals who really feel the cold.
        #LOC_PW_desc_Puf = When we first observed Puf, we were shocked to see it staring right back at us. That pupil-like sea is no ordinary sea, but the deepest sea we've ever seen, eating over 100km into the ground. These depths were likely formed when an asteroid carved through Puf's low-density surface. The thin methane atmosphere and unusually low gravity makes it a relatively easy destination. Just be careful not to bounce back into orbit. \n\nWe can't quite describe it, but there's something unsettling about this planet. The way it watches you through the lens. Maybe it's hiding something.
        #LOC_PW_desc_BorgalsAnomalyA = Until recently, Kerbal scientists thought Dres to be a myth. Now, they're saying they've found a wormhole around it too!
        #LOC_PW_desc_BorgalsAnomalyA_Debdeb = Found wandering around in orbit of Dorau was this wormhole. There's really only one way to find out where it goes!
        #LOC_PW_desc_BorgalsAnomalyA_RSS = A strange wormhole recently discovered in the Solar system. Where could it lead?
        #LOC_PW_desc_BorgalsAnomalyB = This wormhole is the fastest ticket back from here.
        #LOC_PW_desc_Glumo = Groovy Glumo is truly one of a kind. Between the iconic rings and colorful satellites, there's no place quite as stunning. Uniquely, it rolls on its side with a 63° axial tilt. Its gaseous outer layer, containing water, ammonia and ammonium hydrosulfide ices, interacts with the light in different ways per season, causing extreme color changes. As a result, astronomers have on numerous occasions mistaken it for a completely different planet! \n\nBe careful when navigating through the rings, lest you be crushed, pureed and/or julienned by fragments.
        #LOC_PW_desc_Noj = Noj is a singular lone shepherd moon formed from the accretion of ice and other silly things encountered while orbiting Glumo's ring system. Dust stains the ice to create lovely pops of color on it's surface. \n\nPretty colors aside, scientists can't shut up about the initial readings from Noj, and they want more data, if we can get there.
        #LOC_PW_desc_Merbel = Merbel has gone a different aesthetic direction from other celestial bodies. It dons a bold sea of methane and ammonia between its two massive ice caps. The dizzying rotation speed and low inclination gets the equator a lot of Tuun's attention. When you see thick blue belts becoming the next big fashion trend, you'll know which icy icon inspired it!\n\nMerbel's orbital plane is completely off from Glumo's equator, suggesting it was once a planet itself that got captured by Glumo. Other moons may have been destabilized, possibly creating Glumo's iconic rings!

