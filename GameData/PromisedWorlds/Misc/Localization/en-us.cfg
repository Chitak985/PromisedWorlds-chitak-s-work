        // ******** Science Defs (Debdeb System) ********


        // **** crewReport ****
        #LOC_PW_sci_crewReport_default = It appears that the Kerbal upstairs forgot to give this place meaning. Please report this issue to the Promised Worlds dev team.

        // -------------------- Debdeb --------------------

        #LOC_PW_sci_crewReport_DebdebSrfLanded = What a day to have eyes. \n\n...And, there they go.
        #LOC_PW_sci_crewReport_DebdebFlyingLow = You can see Debdeb's sunspots in great detail. That is not a good thing.
        #LOC_PW_sci_crewReport_DebdebFlyingHigh = You take a quick glance at Debdeb's surface and instantly regret your decision.
        #LOC_PW_sci_crewReport_DebdebInSpaceLow = Radiation levels outside are approaching lethal levels.
        #LOC_PW_sci_crewReport_DebdebInSpaceHigh = We are on a journey far from home, basking in the light of a million interstellar fireflies.

        // -------------------- Charr --------------------

        #LOC_PW_sci_crewReport_CharrSrfLandedMoltenCraters = This is not ideal.
        #LOC_PW_sci_crewReport_CharrSrfLandedScorchedCraters = You aren't sure how you managed to land here. Probably best not to linger for long.
        #LOC_PW_sci_crewReport_CharrSrfLandedHotCraters = You admire the fiery crater center. Meanwhile, your craft melts into the ground like a microwaved butter tower.
        #LOC_PW_sci_crewReport_CharrSrfLandedCraters = You're squished back in your seat by the high gravity.
        #LOC_PW_sci_crewReport_CharrSrfLandedMetallicPlains = Glowing bands of iron flow down the endless craters into their soft, gooey centers. You wish the Kerbolar System had a lava planet this epic (sorry, Moho).
        #LOC_PW_sci_crewReport_CharrSrfLandedRockyMountains = An ocean of fire flows over the horizon and out of sight. It is truly a gorgeous sight.
        #LOC_PW_sci_crewReport_CharrSrfLandedPlateaus = The craft groans a little under the high gravity.
        #LOC_PW_sci_crewReport_CharrSrfLandedNorthernCrater = The rock has been blown away revealing the metal underneath.
        #LOC_PW_sci_crewReport_CharrSrfLandedNorthernCraterRays = Thin streaks eminate from the massive crater. You remember the Mun's rayed craters.
        #LOC_PW_sci_crewReport_CharrSrfLandedKrakensPedestal = You feel uneasy here, like something all-powerful is lurking.
        #LOC_PW_sci_crewReport_CharrInSpaceLow = Charr's glowing surface stretches, folds, and flows in a mesmerizing fiery dance. It reminds you of hot summer days, campfires, and orange kerbsicles.
        #LOC_PW_sci_crewReport_CharrInSpaceHigh = The surface is pockmarked, red, and inflamed--a bad case of space acne.

        // -------------------- Ovin --------------------

        #LOC_PW_sci_crewReport_OvinSrfLandedValleys = It's hard to do anything in this high gravity. Even breathing is tough.
        #LOC_PW_sci_crewReport_OvinSrfLandedDivets = Those rings are even more impressive from down here. Not worth all of the effort though.
        #LOC_PW_sci_crewReport_OvinSrfLandedCrushlands = You are deep in Ovin's gravity well--AKA, your spacecraft's new, permanent home.
        #LOC_PW_sci_crewReport_OvinSrfLandedFlats = The ground has been pulverized into an endless expanse of sand, dust, and other small, flat-ish things.
        #LOC_PW_sci_crewReport_OvinSrfLandedHighlands = You marvel at the gravity-smoothed landscape fracturing off into the unknown. It is a beautiful desolation.
        #LOC_PW_sci_crewReport_OvinSrfLandedHills = How Ovin has any form of hills under such immense pressure is a mystery to you. How you plan to leave is also a mystery.
        #LOC_PW_sci_crewReport_OvinSrfLandedNedzerfjord = Nedzerfjord was named after the famous Nedzer Kerman, who died of crushed legs after trying to carry too many snacks.
        #LOC_PW_sci_crewReport_OvinSrfLandedValleyofDespair = Welcome to the Valley of Despair, named as such because...well, look at it.
        #LOC_PW_sci_crewReport_OvinSrfLandedDustyCrater = The spacecraft sinks slightly into the regolith of the crater, making you wonder what would happen if Ovin had quicksand. Let us hope it does not.
        #LOC_PW_sci_crewReport_OvinSrfLandedGreatRift = The Great Northern Rift is a huge diverging plate boundary, where lava from the mantle rises and cools to form these hills and cracks.
        #LOC_PW_sci_crewReport_OvinSrfLandedGreatRiftDivergence = You're right in the middle of the most dangerous seismic location in the Debdeb system. Unsettling.
        #LOC_PW_sci_crewReport_OvinFlyingLow = You fight to keep the craft intact under the extreme gravity. Meanwhile, the gravity giggles at your puny efforts.
        #LOC_PW_sci_crewReport_OvinFlyingHigh = The atmosphere wraps around your craft and tries to pull it down. Not far below, Ovin's smooth, teak surface is a siren's call.
        #LOC_PW_sci_crewReport_OvinInSpaceLow = Ovin's surface is flat as a pancake. If you descend, you will be too.
        #LOC_PW_sci_crewReport_OvinInSpaceHigh = Ovin is the god of wisdom and old age in ancient Kerbal mythology. Based on your travel preferences, you don't seem to want either.

        // -------------------- Gurdamma --------------------

        #LOC_PW_sci_crewReport_GurdammaSrfLandedAbyssalOceans = You are currently several what-the-heckers underwater. You wish you hadn't guzzled all the remaining soda before coming down here.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedDeepOceans = Your craft groans under the tremendous pressure. You realize this is Kerbal Space Program and not Kerbal Submarine Program, right?
        #LOC_PW_sci_crewReport_GurdammaSrfLandedOceans = The sea floor is so barren.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShallows = Waves crash nearby, stronger than you've seen back home. Donk's proximity and the turbulent atmosphere means waves grow to be quite big here.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShores = Imagine blending several tons of sargassum, rotten eggs, and smoked ham in a blender, then leaving it out to dry for a week. That is where we are right now.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedLowlands = The ground is damp and sandy. Rock outcroppings and patches of minerals extend toward the horizon.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMidlands = You feel like you're back home, lost in one of Kerbin's deserts. The massive moon and rings overhead are a reminder of how alien this planet really is.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedHighlands = Moisture collects on the sides of the craft. Fortunately, the anoxic environment means our parts are rust-immune. If only the same were true for unscheduled disassemblies...
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMountains = Soupy clouds meander across the sun-soaked sky as you admire Gurdamma from its highest vantage points.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAlpineMountains = White dust from the nearby volcanoes slowly condenses on the slopes of these mountains.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPeaks = The views of Gurdamma's curvy craters and volcanic mountains makes for a great sight!
        #LOC_PW_sci_crewReport_GurdammaSrfLandedVolcanoes = You peer into the smoldering caldera. The smoldering caldera peers back.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedVolcanoCraters = The manufacturer's warranty certainly doesn't cover exposure to volcanoes. Legal said this was a big no-no.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMountBogue = Mount Bogue is named after the famous Kerbal videographer, Bogue Kerbark. It is said the mountain's height equals his subscriber count.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenCoasts = Loose ash falling from the plumes of nearby active volcanoes litters the ground around you.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenLowlands = Volcanic dust litters the erosion-marked rock like seasoning on a dehydrated pizza crust.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenHighlands = Volcanic dust swirls in the highland wind. A small ash devil snakes past the craft before disintegrating into grey smoke.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenMountains = Smoke wafts by the ship, threatening to clog its instruments.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenAlpineMountains = Thick clouds of dust from nearby volcanoes fill the air and accumulate in drifts on the ground.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenPeaks = The ash falls quickly here. It's a long way down the mountain as it descends out of view, obscured by murky clouds.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPoles = The air outside is clearer, with most of the volcanoes being closer to the equator.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedPolarSeas = Unlike Kerbin's poles, Gurdamma's offer little respite from its brutal heat. Were it not for the atmospheric pressure, the water would be boiling!
        #LOC_PW_sci_crewReport_GurdammaSrfLandedShankastRiver = Ahhh...what a calm place! Other than the giant protoplanetary disk, the actively forming moon, and the severe volcanic activity, that is. Maybe it isn't so calm after all...
        #LOC_PW_sci_crewReport_GurdammaSrfLandedTealRiver = The current is calm here. A respite from the rest of the planet's challenges.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedMylonRiver = Named after the flowing fabric used to manufacture Kerbal spacesuits, the Mylon River is a beautiful but smelly waterway.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlines = Being a continental proto-Kerbin, it comes as no surprise to you that Gurdamma has tectonic activity. You just hope that the activity doesn't decide to happen now.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedAshenFaultlines = What's worse than being next to an active fault line? Being next to an active fault line downwind of an active volcano.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineShallows = A flooded faultline is a rather precarious place to land. At least this one's not that deep...
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineOceans = If it weren't a great feat of interstellar exploration, this might be the kind of place mentioned in those documentaries about missing explorers.
        #LOC_PW_sci_crewReport_GurdammaSrfLandedFaultlineTrenches = Gurdamma's intense seismic activity has created deep trenches; there's nothing like this on Kerbin!
        #LOC_PW_sci_crewReport_GurdammaSplashed = The craft is rocked around by Gurdamma's strong waves.
        #LOC_PW_sci_crewReport_GurdammaSplashedAbyssalOcean = The ocean extends for a great distance below. Given the pressure readings here, you don't want to know what it's like at the bottom.
        #LOC_PW_sci_crewReport_GurdammaSplashedDeepOceans = You are no longer in Kerbins waters, you are slowly becoming the sludge that is Gurdamma's deep oceans.
        #LOC_PW_sci_crewReport_GurdammaSplashedOceans = The craft is rocked around by Gurdamma's strong waves.
        #LOC_PW_sci_crewReport_GurdammaSplashedShallows = You are getting closer to the shore, might go all the way there to see land for the first time in what seems like forever.
        #LOC_PW_sci_crewReport_GurdammaSplashedShores = Waves crash nearby, stronger than you've seen back home. Donk's proximity and the turbulent atmosphere means waves grow to be quite big here.
        #LOC_PW_sci_crewReport_GurdammaSplashedAshenCoasts = The water is no longer just smelly, but also contains a thin layer of ash from Gurdamma's volcanoes.
        #LOC_PW_sci_crewReport_GurdammaSplashedPolarSeas = You can see the rings, the protoplanetary disk, everything from these high latitudes.
        #LOC_PW_sci_crewReport_GurdammaSplashedShankastRiver = The flow of the river is rough, but the sight of the protoplanetary disk and donk make this river cruise quite worth it!
        #LOC_PW_sci_crewReport_GurdammaSplashedTealRiver = You imagine getting out on the river in a little boat and letting the flow take you away.
        #LOC_PW_sci_crewReport_GurdammaSplashedMylonRiver = Despite holding against the high atmospheric pressure, the craft somehow can't keep out the sickly salty smell of Gurdamma's oceans.
        #LOC_PW_sci_crewReport_GurdammaSplashedFaultlineShallows = You feel as if there is nothing that can stop you from diving into Gurdamma's depths.
        #LOC_PW_sci_crewReport_GurdammaSplashedFaultlineOceans = The water is much warmer here, evaporating all around you. Something must be happening on the ocean floor.
        #LOC_PW_sci_crewReport_GurdammaSplashedFaultlineTrenches = If you had sonar, you wouldn't want to have sonar. That's how deep these trenches are.
        #LOC_PW_sci_crewReport_GurdammaFlyingLow = This is the ultimate interstellar adventure. You wish you could land, unfurl a beach umbrella, and lounge in Debdeb's alien sunbeams.
        #LOC_PW_sci_crewReport_GurdammaFlyingHigh = Far below, Gurdamma's crater lakes shimmer cheerfully. The young land fades in and out of view beneath the wispy clouds and volcanic ash.
        #LOC_PW_sci_crewReport_GurdammaInSpaceLow = It looks humid down there. If Gurdamma ever has a gnat infestation, I'm gonna cry.
        #LOC_PW_sci_crewReport_GurdammaInSpaceHigh = You can't help but marvel at how analogous Gurdamma, Donk, and Gup are to Kerbin, the Mun, and Minmus. It's like you have traveled back in time.

        // -------------------- Donk --------------------

        #LOC_PW_sci_crewReport_DonkSrfLandedLavaLakes = You contemplate how you managed to land on a lava lake. While impressive, it's probably time to get going now.
        #LOC_PW_sci_crewReport_DonkSrfLandedBasaltBasins = Heat waves rise from the dark, fractured surface. This would be a great place to toast a snack!
        #LOC_PW_sci_crewReport_DonkSrfLandedMares = The landscape reminds you of the first pictures Kerbonauts took on the Mun... except it's enveloped by an exosphere of volcanic fumes. Epic!
        #LOC_PW_sci_crewReport_DonkSrfLandedMidlands = Boulders and basaltic shards stretch off into the tan-hued unknown.
        #LOC_PW_sci_crewReport_DonkSrfLandedHighlands = Boulder clumps and chaotic rock formations dominate the highlands of this crater-infested world.
        #LOC_PW_sci_crewReport_DonkSrfLandedMountains = It seems like things are going well! You're on top of the world - or at least this moon.
        #LOC_PW_sci_crewReport_DonkSrfLandedCraters = Out the window, the walls of the crater rise up around you. You feel a bit trapped.
        #LOC_PW_sci_crewReport_DonkSrfLandedPolarLowlands = You wonder what will await you at Donk's poles - maybe there's a really big bearing that it spins around, like that one model back in school.
        #LOC_PW_sci_crewReport_DonkSrfLandedPolarMidlands = It's easy to forget the violence of Donk's environment from here - maybe we can stay for a bit?
        #LOC_PW_sci_crewReport_DonkSrfLandedPolarHighlands = Donk's poles give the best views of Gurdamma's rings. They're both majestic and scary.
        #LOC_PW_sci_crewReport_DonkFlyingLowLavaLakes = Wispy tendrils of rock vapor and other yucky fumes rise from the molten lake and dissipate into the sky.
        #LOC_PW_sci_crewReport_DonkFlyingHigh = A gentle wind lifts the craft as Donk's atmosphere escapes into space.
        #LOC_PW_sci_crewReport_DonkInSpaceLow = Like the Mun, Donk has mare, craters, lava, an atmosphere...\n\nOn second thought, maybe they aren't so similar after all.
        #LOC_PW_sci_crewReport_DonkInSpaceHigh = Donk glows a soft, white color. It complements the wispy grays of the protoplanetary disk well.

        // -------------------- Gup --------------------

        #LOC_PW_sci_crewReport_GupSrfLandedDunes = Far from the equator, you can almost feel the gravity here.
        #LOC_PW_sci_crewReport_GupSrfLandedSlopes = It's difficult to tell which way gravity is pulling you and how fast.
        #LOC_PW_sci_crewReport_GupSrfLandedRockySlopes = You can't tell which way these slopes go, since gravity is so weak. Which way is down again?
        #LOC_PW_sci_crewReport_GupSrfLandedBurrens = You feel weightless here. A ground anchor would be useful.
        #LOC_PW_sci_crewReport_GupSrfLandedEquatorialRidge = The terrain slopes away from you parabolically on both sides. Or is it linearly? You regret leaving your leveler tool at home.
        #LOC_PW_sci_crewReport_GupSrfLandedPoles = You slowly spin around with the rotation of the moon. Round and round. Round, and round. Whee!
        #LOC_PW_sci_crewReport_GupInSpaceLow = You know what would be cool? An EVA race around the equatorial ridge! First one to lap the moon wins the rest of the snacks.
        #LOC_PW_sci_crewReport_GupInSpaceHigh = Gup would make for a good skipping stone. \n...Too bad Gurdamma doesn't have a lake big enough to skip it across.

        // -------------------- Lapat --------------------

        #LOC_PW_sci_crewReport_LapatSrfSplashedLakes = Even the water here hates you.
        #LOC_PW_sci_crewReport_LapatSrfLandedLakes = Even the water here hates you.
        #LOC_PW_sci_crewReport_LapatSrfLandedShores = Nothing like a sunny day at the beach. Don't forget your sunscreen!
        #LOC_PW_sci_crewReport_LapatSrfLandedDunes = You don't like sand. It's coarse and rough and irritating and it gets everywhere. Looks like you're out of luck today.
        #LOC_PW_sci_crewReport_LapatSrfLandedRuggedlands = You fear the craft being skewered by the unforgiving terrain.
        #LOC_PW_sci_crewReport_LapatSrfLandedPlateaus = The rusty sandstone reminds you of the badlands back at home.
        #LOC_PW_sci_crewReport_LapatSrfLandedGreatMesa = It's better we stay up here rather than down there.
        #LOC_PW_sci_crewReport_LapatFlyingLow = The craft is struggling to cope with the pressure outside. It's like flying through soup that REALLY wants to get inside very very fast.
        #LOC_PW_sci_crewReport_LapatFlyingHigh = You struggle to make out the lowlands. They are obscured by Lapat's immense atmosphere.
        #LOC_PW_sci_crewReport_LapatInSpaceLow = The surface is an awkward blend of deep reds, dirty oranges, cloudy whites, and dirty blues. Mission control likes referring to these color combos as "clown vomit".
        #LOC_PW_sci_crewReport_LapatInSpaceHigh = A dirty marble.

        // -------------------- Axod --------------------

        #LOC_PW_sci_crewReport_AxodInSpaceLow = The great cliffs of Axod are no joke from up here! Those flashy vacation billboards really nailed it.
        #LOC_PW_sci_crewReport_AxodInSpaceHigh = You strangely remember something like this back in the Kerbolar System. Mission control denies this and wants you in for a psychological evaluation.
        #LOC_PW_sci_crewReport_AxodSrfLandedPockmarks = Your eyes scan across the sky, searching for Axod's thin ring.
        #LOC_PW_sci_crewReport_AxodSrfLandedMidlands = Your eyes scan across the sky, searching for Axod's thin ring.
        #LOC_PW_sci_crewReport_AxodSrfLandedHills = You try to spot Axod's small moon, Umod, in the sky.
        #LOC_PW_sci_crewReport_AxodSrfLandedCraters = Tall slopes surround the crater. Impressive!
        #LOC_PW_sci_crewReport_AxodSrfLandedGreatCliffs = The cliffs are even taller and more breathtaking in person! You feel dizzy seeing their scale.
        #LOC_PW_sci_crewReport_AxodSrfLandedSpires = How did these get here? You question what could have formed these magnificent spires, while almost breaking your back looking up.

        // -------------------- Umod --------------------

        #LOC_PW_sci_crewReport_UmodSrfLandedPits = The view of the horizon is obscured from all sides.
        #LOC_PW_sci_crewReport_UmodSrfLandedFissures = The terrain here is stretched and folded, difficult to navigate.
        #LOC_PW_sci_crewReport_UmodSrfLandedMidlands = Umod's complex rings fill most of the sky, like giant paint strokes.
        #LOC_PW_sci_crewReport_UmodSrfLandedMountains = These rocky mountains jut out of the ground unnaturally, reminding you of gravel. No doubt a result of Umod's violent formation.
        #LOC_PW_sci_crewReport_UmodSrfLandedPeaks = We are at the tippy top of the largest mountain on Umod. The view of the rings and the protoplanetary disk is beyond epic.
        #LOC_PW_sci_crewReport_UmodSrfLandedEquator = The ground is very sloped here. Mind lest the craft topples over.
        #LOC_PW_sci_crewReport_UmodInSpaceLow = The surface is dimpled and shattered, but not cratered. There are a lot of crazy patterns going on down there.
        #LOC_PW_sci_crewReport_UmodInSpaceHigh = Umod reminds you of a crunched up ball of tin foil. And those rings are spectacular.

        // -------------------- Dorau --------------------

        #LOC_PW_sci_crewReport_DorauSrfLanded = Ah.
        #LOC_PW_sci_crewReport_DorauFlyingLow = It's a wonder that the craft is still craft-shaped here.
        #LOC_PW_sci_crewReport_DorauFlyingHigh = It's peaceful up here. The depths are somewhat inviting though.
        #LOC_PW_sci_crewReport_DorauInSpaceLow = You have a good view of Dorau's violent storms, colliding and flowing.
        #LOC_PW_sci_crewReport_DorauInSpaceHigh = The azure clouds of Dorau remind you of home.

        // -------------------- Bis --------------------

        #LOC_PW_sci_crewReport_BisSrfLandedCantaloupeTerrain = The lumpy terrain reminds you of the mountains back on Kerbin. You are a long way from home.
        #LOC_PW_sci_crewReport_BisSrfLandedCryolavaFlats = The ground is very flat and smooth here. You imagine yourself skating across the ice.
        #LOC_PW_sci_crewReport_BisSrfLandedCryovolcanoes = The ground shifts a little. There must be a lot going on under the ice.
        #LOC_PW_sci_crewReport_BisSrfLandedLowlands = You catch a glimpse of the thin atmosphere. It's definitely not thick enough for a barrel roll.
        #LOC_PW_sci_crewReport_BisSrfLandedMidlands = You spot Kerbol in the sky. From here your home just looks like any other star.
        #LOC_PW_sci_crewReport_BisSrfLandedHighlands = Debdeb's proto-disk arcs across the sky. The sight is beyond epic.
        #LOC_PW_sci_crewReport_BisSrfLandedCanyons = This canyon makes you think of a lonely gray dwarf planet back in the Kerbol system with a deep canyon. Strange. You write it off as a figment of your imagination.
        #LOC_PW_sci_crewReport_BisSrfLandedPoles = Here you can see the faint trails left by the distant cryovolcanoes.
        #LOC_PW_sci_crewReport_BisSrfLandedMoundlands = The ground is so knobbly here, like you're a mere bug on a giant bowl of rice. Don't tip over!
        #LOC_PW_sci_crewReport_BisSrfLandedStainedCantaloupeTerrain = Someone must've spilled a lot of coffee here. Nobody tell Keri.
        #LOC_PW_sci_crewReport_BisSrfLandedPlanitia = The ice is so bright here, it hurts to look at. You remember the snowy days back on Kerbin.
        #LOC_PW_sci_crewReport_BisSrfLandedCrystallizedCanyons = The sparkling crystals remind you of the months that you spent staring into the empty void on the way here.
        #LOC_PW_sci_crewReport_BisFlyingLow = You wish you could stick your head out of the window and feel the wind hit your face.
        #LOC_PW_sci_crewReport_BisFlyingHigh = The atmosphere is a minor inconvenience here.
        #LOC_PW_sci_crewReport_BisInSpaceLow = They weren't kidding. The atmosphere really is thin here.
        #LOC_PW_sci_crewReport_BisInSpaceHigh = Seeing the reflective surface after travelling through dark space hurts your eyes a bit.

        // ******** evaReport ********

        #LOC_PW_sci_evaReport_default = It appears that the Kerbal upstairs forgot to give this place meaning. Please report this issue to the Promised Worlds dev team.

        // -------------------- Debdeb --------------------

        #LOC_PW_sci_evaReport_DebdebSrfLanded = Hot potato, hot potato, hot hot hot--
        #LOC_PW_sci_evaReport_DebdebFlyingLow = A--\n\n*dies*
        #LOC_PW_sci_evaReport_DebdebFlyingHigh = AAAA--\n\n*dies*
        #LOC_PW_sci_evaReport_DebdebInSpaceLow = Thank you. I am now blind.
        #LOC_PW_sci_evaReport_DebdebInSpaceHigh = The stars used to amaze me. Now, having traveled the infinite void between, they frighten me.

        // -------------------- Charr --------------------

        #LOC_PW_sci_evaReport_CharrSrfLandedMoltenCraters = I can't feel my feet anymore, or any part of my body. Gotta love those eighth-degree burns.
        #LOC_PW_sci_evaReport_CharrSrfLandedScorchedCraters = I can't feel my feet anymore. Gotta love those third-degree burns.
        #LOC_PW_sci_evaReport_CharrSrfLandedHotCraters = The soles of my space shoes are liquefying. Soon, we will too.
        #LOC_PW_sci_evaReport_CharrSrfLandedCraters = Your knees are close to giving way under this gravity. And to think this is tame compared to Ovin
        #LOC_PW_sci_evaReport_CharrSrfLandedMetallicPlains = I keep seeing little flashes of light dance across the ground. The intense solar wind must be exciting Charr's metallic crust.
        #LOC_PW_sci_evaReport_CharrSrfLandedRockyMountains = The ground is warm enough to fry an egg on. If only we had an egg immune to exploding in the vacuum...
        #LOC_PW_sci_evaReport_CharrSrfLandedPlateaus = I don't understand why you sent us on this mission. A papier-mache crew is hardly fit for exploring an inferno!
        #LOC_PW_sci_evaReport_CharrSrfLandedNorthernCrater = The exposed metal is like a foggy mirror. You look down and wave at yourself.
        #LOC_PW_sci_evaReport_CharrSrfLandedNorthernCraterRays = The heat here is unlike any heatwave back home. More like armageddon.
        #LOC_PW_sci_evaReport_CharrSrfLandedKrakensPedestal = Something is watching you. You can feel it.
        #LOC_PW_sci_evaReport_CharrInSpaceLow = Gosh...those luminous reds, oranges, and yellows are gorgeous! It's best to appreciate them from up here, though.
        #LOC_PW_sci_evaReport_CharrInSpaceHigh = It's curious how a superheated iron core feels hotter than a typical molten world, just as children are often more scared of a hot metal slide than a fire.

        // -------------------- Ovin --------------------

        #LOC_PW_sci_evaReport_OvinSrfLandedValleys = Talking...is...hard. Pull...on...jaw...is...too...strong...
        #LOC_PW_sci_evaReport_OvinSrfLandedDivets = I want to write you an EVA Report, but every time I grab a pen, it feels like my fingers are going to tear off.
        #LOC_PW_sci_evaReport_OvinSrfLandedCrushlands = I can't stop thinking about that one Kerbal legend. Powerful, dinosaur-like creatures supposedly live on Ovin, with jaws strong enough to cut through a reinforced lander.\n\n...did we confirm that Ovin is lifeless before coming here?
        #LOC_PW_sci_evaReport_OvinSrfLandedFlats = Such a flat, desolate landscape. Who would ever want to come here? Ooooh pretty rings.
        #LOC_PW_sci_evaReport_OvinSrfLandedHighlands = I'm trying to look up at the rings but it's hard to lift my head.
        #LOC_PW_sci_evaReport_OvinSrfLandedHills = I might just be the tallest thing on this planet--until the pressure rockets my spine out my butt. Then I might be the deadest thing.
        #LOC_PW_sci_evaReport_OvinSrfLandedNedzerfjord = Mad respect to Nedzer; I can barely carry myself right now.
        #LOC_PW_sci_evaReport_OvinSrfLandedValleyofDespair = I can't tell if the aching in my heart is from anxiety or all my blood pooling into my legs. Probably both.
        #LOC_PW_sci_evaReport_OvinSrfLandedDustyCrater = It is hard to tell if I am sinking into the regolith, or if I am sinking into myself.
        #LOC_PW_sci_evaReport_OvinSrfLandedHefftyCliffs = Imagine skiing down these slopes; you would probably break a land speed record.
        #LOC_PW_sci_evaReport_OvinSrfLandedGreatNorthernRift = The only thing quaking right now is my stomach. All this heavy lifting is making me hungry.
        #LOC_PW_sci_evaReport_OvinSrfLandedGreatSouthernRift = Maw of The Kraken, huh? Think it would mind if we fed it our cockpit trash?
        #LOC_PW_sci_evaReport_OvinSrfLandedLesserNorthernRift = Volatile...prone to sudden edge collapses...and yet, here we are. I cannot determine whether your disregard for safety is bravery or stupidity.
        #LOC_PW_sci_evaReport_OvinSrfLandedVinitaFissure = Can I throw a rock over the fissure and see how large an impact it makes? You know, for science?
        #LOC_PW_sci_evaReport_OvinFlyingLow = Things are not looking good for me.
        #LOC_PW_sci_evaReport_OvinFlyingHigh = WHY AM I OUTSIDE? Do you think a parachute is enough to save a Kerbal here???
        #LOC_PW_sci_evaReport_OvinInSpaceLow = I can feel the gravity tugging on my bones from here. I don't think I was built for whatever you have in mind for me.
        #LOC_PW_sci_evaReport_OvinInSpaceHigh = Look at how dense those rings are. Ovin took something and completely, utterly obliterated it. \nLet's hope we don't join them.

        // -------------------- Gurdamma --------------------

        #LOC_PW_sci_evaReport_GurdammaSrfLandedAbyssalOceans = The craft creaks under the pressure. The water REALLY wants to get inside.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedDeepOceans = Hi--\n*Chokes on water*
        #LOC_PW_sci_evaReport_GurdammaSrfLandedOceans = DID YOU SEE THAT??? There's something in the water! \n\nNope, nevermind. Just rocks.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedShallows = The water is super hot. This must be what it's like to swim inside of a kettle.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedShores = OH WO- EWWWWWWWWWWWW!!! The STENCH! BleH! OH NO!
        #LOC_PW_sci_evaReport_GurdammaSrfLandedLowlands = Note to self: next time, bring a beach towel and umbrella. Our first settlement here should be a beach villa. Ahhhhh...
        #LOC_PW_sci_evaReport_GurdammaSrfLandedMidlands = This place has the exciting terrain of the Mun, the equatorial warmth of Kerbin, and the timeless peace of Duna. And no taxes! Who knew heaven was a place on Gurdamma...
        #LOC_PW_sci_evaReport_GurdammaSrfLandedHighlands = Yeesh, it's humid. I need windshield wipers for my visor.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedMountains = My skin feels sticky, even from inside my suit. I feel like a microwave casserole dunked in maple syrup.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAlpineMountains = The volcanic ash slowly settles on your feet, but it's no more noticeable than if you kicked up Mun dust.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedPeaks = The view of the mountain tops is wonderful. Wonder what it looks like at sunset!
        #LOC_PW_sci_evaReport_GurdammaSrfLandedVolcanoes = "Let's land at the edge of an active volcano", they said. "It'll be fun", they said.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedVolcanoCraters = Your suit didn't always look this melty, right?
        #LOC_PW_sci_evaReport_GurdammaSrfLandedMountBogue = Well...if we want to maintain Mount Bogue's legend, everyone who lands here should subscribe to Bogue, then unsubscribe after takeoff. Not that there's any cell service to do so...
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAshenLowlands = This stuff can't be good to inhale. You checked my air filters before sending me out... right?
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAshenHighlands = I wonder if Gurdamma's volcanoes have firenadoes raging over them.\n\nActually, forget I said that. There's plenty of science here, okay?
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAshenMountains = I need a personal air sprayer; all this dust is clouding my visor.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAshenAlpineMountains = The dust in the air slowly over many hours condenses on your suit. Wonder if it has the same properties as Mun dust.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAshenPeaks = The dust from the nearby volcanes somewhat sticks to your feet, but it's largely ash and less... electrostatic.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedPoles = With a clear view on EVA, it's still very cloudy.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedPolarSeas = It's very cold, yet the temperature around you varies, likely because of volcanic activity on this planet.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedShankastRiver = That water looks chunky. \nWater isn't supposed to be chunky.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedTealRiver = It's a good thing that Gurdamma is sterile. Otherwise there would be a million new diseases cooking in that water.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedMylonRiver = Even the rivers have huge waves on Gurdamma.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedFaultlines = I cannot determine if it's the ground shaking or my nerves.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedAshenFaultlines = I think I would rather die in an earthquake than in a volcanic eruption. That said, if it's an option, I would rather not die at all.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedFaultlineShallows = The water is so hot here. You feel like you're boiling inside of a kettle.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedFaultlineOceans = Here you can feel the vibrations from the faultines in the water.
        #LOC_PW_sci_evaReport_GurdammaSrfLandedFaultlineTrenches = At the bottom of these trenches, you find hydrothermal vents; the place where life back on Kerbin first started. This is groundbreaking. We must get samples.
        #LOC_PW_sci_evaReport_GurdammaSplashedAbyssalOcean = The water is freezing here. We are at the coldest place on Gurdamma.
        #LOC_PW_sci_evaReport_GurdammaSplashedDeepOceans = You feel seasickness coming on as the waves toss you around.
        #LOC_PW_sci_evaReport_GurdammaSplashedOceans = You feel seasickness coming on as the waves toss you around.
        #LOC_PW_sci_evaReport_GurdammaSplashedShallows = First workout on another planet? Might just make the journey to Gurdamma's land by swimmming, now that you're out on EVA.
        #LOC_PW_sci_evaReport_GurdammaSplashedShores = Swimming against the waves is quite a workout.
        #LOC_PW_sci_evaReport_GurdammaSplashedAshenCoasts = Loose ash on the ground from nearby volcanoes is littered around you.
        #LOC_PW_sci_evaReport_GurdammaSplashedPolarSeas = You feel seasickness coming on as the waves toss you around.
        #LOC_PW_sci_evaReport_GurdammaSplashedShankastRiver = This would be a great spot for tubing. Mission control puts it on their to-do list.
        #LOC_PW_sci_evaReport_GurdammaSplashedTealRiver = You imagine a big boat race through this river.
        #LOC_PW_sci_evaReport_GurdammaSplashedMylonRiver = It would be fun to race planes through the tight turns of this river.
        #LOC_PW_sci_evaReport_GurdammaSplashedFaultlineShallows = On EVA, you feel nothing but fear from the rumbling in the water. It's now right below your feet as they dangle in the abyss.
        #LOC_PW_sci_evaReport_GurdammaSplashedFaultlineOceans = If Kerbin's deepest oceans scared you, Gurdamma's shouldn't... right?
        #LOC_PW_sci_evaReport_GurdammaSplashedFaultlineTrenches = The water is very warm here. There must be lots of activity on the sea floor.
        #LOC_PW_sci_evaReport_GurdammaFlyingLow = WOOOOOO HOOOOOOO! CANNONBALLLLLL!
        #LOC_PW_sci_evaReport_GurdammaFlyingHigh = The air is so soupy, I bet I would hit the ground no harder than a feather. Let's not try it, though.
        #LOC_PW_sci_evaReport_GurdammaInSpaceLow = I love the color turquoise. Gurdamma makes me feel rejuvenated.
        #LOC_PW_sci_evaReport_GurdammaInSpaceHigh = My goodness, look at those rings! How does Donk cut through them so smoothly?

        // -------------------- Donk --------------------

        #LOC_PW_sci_evaReport_DonkSrfLandedLavaLakes = EEYYEEEEEEEEEEEEEE OWOWOWOWOWOWWWWWW--
        #LOC_PW_sci_evaReport_DonkSrfLandedBasaltBasins = I suppose I am the toasted snack today. :(
        #LOC_PW_sci_evaReport_DonkSrfLandedMares = This atmosphere is cool and all, but it's definitely goofing up my air filters. I can taste something vulgar in my mouth, and it's not old snacks.
        #LOC_PW_sci_evaReport_DonkSrfLandedMidlands = I wish the Mun had lava. How is it that there isn't a single pool of lava in the Kerbol System?
        #LOC_PW_sci_evaReport_DonkSrfLandedHighlands = Can you imagine if we had Donk around Kerbin instead of the Mun? Sure, it would result in mass destruction, but it would be a great adventure for about five minutes.
        #LOC_PW_sci_evaReport_DonkSrfLandedMountains = You're a little confused why this location is considered a mountain. To you, it looks more like a cratered mound jutting up from the surrounding land. Maybe the surveyor team had one too many snacks while writing their biome report.
        #LOC_PW_sci_evaReport_DonkSrfLandedCraters = This is it: the quintessential moon experience! Like snowflakes, every crater is unique. Maybe you can make this one yours.
        #LOC_PW_sci_evaReport_DonkSrfLandedPolarLowlands = Only a fraction of Kerbinauts have visited the Mun's poles. Just wait until they hear about you!
        #LOC_PW_sci_evaReport_DonkSrfLandedPolarMidlands = Boulders and basaltic shards stretch off into the tan-hued unknown. Meanwhile, Donk's terminator lazily loops around the pole.
        #LOC_PW_sci_evaReport_DonkSrfLandedPolarHighlands = For a newly-formed, tidally-stressed moon, it sure is cold up here.
        #LOC_PW_sci_evaReport_DonkFlyingLow = One small step for me...one giant, interstellar leap for Kerbalkind.
        #LOC_PW_sci_evaReport_DonkFlyingHigh = This is probably not a good idea. Do I look like a bird to you?
        #LOC_PW_sci_evaReport_DonkInSpaceLow = Do not deorbit me into a lava lake. I repeat: do NOT deorbit me into a lava lake.
        #LOC_PW_sci_evaReport_DonkInSpaceHigh = We're going to be passing by Donk a lot; it's almost impossible NOT to get an intercept with it.

        // -------------------- Gup --------------------

        #LOC_PW_sci_evaReport_GupSrfLandedDunes = Every step kicks up a plume of sand particles. It's best you don't let those get inside the craft.
        #LOC_PW_sci_evaReport_GupSrfLandedSlopes = These should be called the Slopes of Sisyphus. The further you climb toward the equator, the harder your journey becomes, despite the terrain remaining mostly level.
        #LOC_PW_sci_evaReport_GupSrfLandedRockySlopes = You could almost fall back towards the poles here. The terrain is nearly vertical.
        #LOC_PW_sci_evaReport_GupSrfLandedBurrens = The gravity is hardly noticeable here. You forget which way is down.
        #LOC_PW_sci_evaReport_GupSrfLandedEquatorialRidge = I wonder if we could build a ring station around Gup. Then we could visit Gurdamma whenever we want!
        #LOC_PW_sci_evaReport_GupSrfLandedPoles = This is like being on one of those playground carousels, but really, really boring. I miss being demolished by centrifugal force.
        #LOC_PW_sci_evaReport_GupInSpaceLow = EVA RACE, OH YEAHHHHH!
        #LOC_PW_sci_evaReport_GupInSpaceHigh = If you're thinking about using ME as a skipping stone on Gurdamma...don't. \n\nI'm a sinker.

        // -------------------- Lapat --------------------

        #LOC_PW_sci_evaReport_LapatSrfLandedLakes = Hey, I think I see something in the distance. \nIt's a fishie...\nWow, a BIG fishie...\n\nHey, wait a minute...\n\nIT'S COMING FOR MEEEEE LET ME BACK IN AUGHHHHH--\n\ It was just a rock. Lapat has a lot of rocks that looks like things.
        #LOC_PW_sci_evaReport_LapatSrfLandedShores = I bet I can make a necklace with all this metal. Do you think it's poisonous? Only one way to find out.
        #LOC_PW_sci_evaReport_LapatSrfLandedDunes = You try to build a little sand castle with your hands, but the sand is dry, sharp and gets blown in the wind.
        #LOC_PW_sci_evaReport_LapatSrfLandedRuggedlands = The high pressure gives you a headache, even with your protective space suit on. It's like walking through soup.
        #LOC_PW_sci_evaReport_LapatSrfLandedPlateaus = The terrain is scattered and broken...just like my brain before finals week.
        #LOC_PW_sci_evaReport_LapatSrfLandedGreatMesa = It's so beautiful up here. Too bad I can't take off my helmet and take it all in.
        #LOC_PW_sci_evaReport_LapatFlyingLow = At least parachutes will work here. Otherwise, I feel like I'm sinking in water.
        #LOC_PW_sci_evaReport_LapatFlyingHigh = It's a cool view from up here. Too bad I can't see anything beyond the mesas.
        #LOC_PW_sci_evaReport_LapatInSpaceLow = Hey--don't make fun of Lapat for looking like clown vomit. I mean, look at us Kerbals. There is beauty in strangeness.
        #LOC_PW_sci_evaReport_LapatInSpaceHigh = Lapat can't hurt me from up here.

        // -------------------- Axod --------------------

        #LOC_PW_sci_evaReport_AxodSrfLandedPockmarks = You spot a little dot up in the sky. Is that Umod?
        #LOC_PW_sci_evaReport_AxodSrfLandedCraters = You scan the sky, searching for Axod's thin ring. It's hard to spot because it's so faint.
        #LOC_PW_sci_evaReport_AxodSrfLandedMidlands = The days and nights are so short here. This will have disastrous effects on your sleep schedule.
        #LOC_PW_sci_evaReport_AxodSrfLandedHills = The ground is mostly regolith. It reminds you of the Mun.
        #LOC_PW_sci_evaReport_AxodSrfLandedCliffs = The cliffs are even more impressive from here than from orbit. Be careful not to hurt your neck as you take it all in.
        #LOC_PW_sci_evaReport_AxodSrfLandedSpires = Who put these here?
        #LOC_PW_sci_evaReport_AxodInSpaceLow = The protoplanetary disk drowns out the rings. They're hard to spot.
        #LOC_PW_sci_evaReport_AxodInSpaceHigh = Hehe, little potato world. You're feeling hungry now.

        // -------------------- Umod --------------------

        #LOC_PW_sci_evaReport_UmodSrfLandedPits = Umod does not look nearly as appetizing from below as it does from space.
        #LOC_PW_sci_evaReport_UmodSrfLandedFissures = You feel like a teeny tiny insect standing on a ball of scrunched up paper.
        #LOC_PW_sci_evaReport_UmodSrfLandedMidlands = The view of the rings never gets old.
        #LOC_PW_sci_evaReport_UmodSrfLandedMountains = If I fall from here, I too will suffer a catastrophic event like Umod.
        #LOC_PW_sci_evaReport_UmodSrfLandedPeaks = This is peak. I feel elevated.
        #LOC_PW_sci_evaReport_UmodSrfLandedEquator = You feel weightless here, like you could jump into orbit. Let's not test that.
        #LOC_PW_sci_evaReport_UmodInSpaceLow = Awww, Umod's dimples look so cute.
        #LOC_PW_sci_evaReport_UmodInSpaceHigh = Umod looks a lot like the dustballs I find under my refrigerator. \nMaybe I should clean more often.

        // -------------------- Dorau --------------------

        #LOC_PW_sci_evaReport_DorauSrfLanded = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAARRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRGGGGGGGGGGGGGGGGGGGGHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHH
        #LOC_PW_sci_evaReport_DorauFlyingLow = The "Being Outside While Flying Low" conditions are NOT favorable right now. It is cold, dim, and foggy. Yek.
        #LOC_PW_sci_evaReport_DorauFlyingHigh = Is it peaceful here? Yes. Is it cold here? Also yes. Let me back inside, NOW.
        #LOC_PW_sci_evaReport_DorauInSpaceLow = I love observing Dorau's clouds from afar. \n\nFROM. AFAR.
        #LOC_PW_sci_evaReport_DorauInSpaceHigh = Zzzzzz...\n\nHuh? What??

        // -------------------- Bis --------------------

        #LOC_PW_sci_evaReport_BisSrfLandedCantaloupeTerrain = The ground crunches under your feet, like a bis-cuit. \n\nWait...
        #LOC_PW_sci_evaReport_BisSrfLandedCryolavaFlats = Time to fulfil your dream of skating across these icy flats. \n\nAnd you never packed your ice skates...
        #LOC_PW_sci_evaReport_BisSrfLandedCryovolcanoes = Your neck creaks from looking up at the plumes constantly. It's best for your health if you stop, but they're sooooo pretty.
        #LOC_PW_sci_evaReport_BisSrfLandedLowlands = Some substance in the atmosphere causes a blue halo effect around Debdeb. The science team are going to love this.
        #LOC_PW_sci_evaReport_BisSrfLandedMidlands = A cold breeze hits you. Despite your suit's temperature control, you can't help but shiver. Brrrrrrrr...
        #LOC_PW_sci_evaReport_BisSrfLandedHighlands = The fine ice rocks on the ground crunch as you walk around. You suddenly crave snacks.
        #LOC_PW_sci_evaReport_BisSrfLandedCanyons = You feel a small tremor. There must be something big down there.
        #LOC_PW_sci_evaReport_BisSrfLandedPoles = Debdeb's proto-disk is very low in the sky. This is a great spot for stargazing.
        #LOC_PW_sci_evaReport_BisSrfLandedMoundlands = You kick yourself for never thinking of packing a sled. This would've been the perfect spot.
        #LOC_PW_sci_evaReport_BisSrfLandedStainedCantaloupeTerrain = In your sleep-deprived state, you mistake small pebbles on the ground for coffee beans. You fear that a coffee revolution is coming...
        #LOC_PW_sci_evaReport_BisSrfLandedPlanitia = The ground is a big sheet of shiny ice. You watch your step, taking care not to slip.
        #LOC_PW_sci_evaReport_BisSrfLandedCrystallizedCanyons = The crystals are even more mesmerizing up close. You decide you never want to leave here.
        #LOC_PW_sci_evaReport_BisFlyingLow = You can feel the mildest gusts of wind hitting your suit.
        #LOC_PW_sci_evaReport_BisFlyingHigh = The icy landscape is beautiful from up here.
        #LOC_PW_sci_evaReport_BisInSpaceLow = Those swathes of crimson remind you of a piece of abstract art hung up back at the KSC astronaut complex. Now it has meaning in a way.
        #LOC_PW_sci_evaReport_BisInSpaceHigh = Those swathes of crimson remind you of a piece of abstract art hung up back at the KSC astronaut complex. Now it has meaning in a way.

        // ******** surfaceSample ********

        #LOC_PW_sci_surfaceSample_default = It appears that the Kerbal upstairs forgot to give this place meaning. Please report this issue to the Promised Worlds dev team.

        // -------------------- Debdeb --------------------

        #LOC_PW_sci_surfaceSample_DebdebSrfLanded = The sample tube melts in whatever is left of your hand.

        // -------------------- Charr --------------------

        #LOC_PW_sci_surfaceSample_CharrSrfLandedMoltenCraters = The sample tube melts into oblivion, taking your hands, your arms and you with it.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedScorchedCraters = The sample tube crumples and shatters. Oops.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedHotCraters = Ouh! Ow! Hot hot hot!
        #LOC_PW_sci_surfaceSample_CharrSrfLandedCraters = It's tough to get a sample when the ground is solid metal. After a lot of struggling, you break off a chunk of pure metallic iron.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedMetallicPlains = It's tough to get a sample when the ground is solid metal. After a lot of struggling, you break off a chunk of pure metallic iron.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedRockyMountains = The sample consists of loose rocks with flecks of metal.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedPlateaus = The sample contains slabs of rock interlayered with a strange, black compound that is probably not safe to eat.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedNorthernCrater = It's tough to get a sample when the ground is solid metal. After a lot of struggling, you break off a chunk of pure metallic iron.
        #LOC_PW_sci_surfaceSample_CharrSrfLandedNorthernCraterRays = The sample consists of loose rocks topped with a layer of fine dust. Let's try to keep that inside of the container.

        // -------------------- Ovin --------------------

        #LOC_PW_sci_surfaceSample_OvinSrfLandedValleys = The sample slips through your fingers and onto the ground. You debate retrieving it, but ultimately decide your fingers are more valuable.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedDivets = You strain to lift the sample, but all you strain is your back.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedCrushlands = The sample contains compact silicate rocks rich with iron, magnesium, and a superdense compound not listed in the material chemistry databank. Maybe it's that dark matter we've been looking for! That would explain a lot about this place.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedFlats = The sample contains pulverized silicate, quartz crystal shards, and a bizarre, porous material with incredible compression strength. The R&D department is going to love this!
        #LOC_PW_sci_surfaceSample_OvinSrfLandedNedzerfjord = To your relief, the sample does not contain any crushed leg bones.\n\n...Yet.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedValleyofDespair = The sample contains compressed silicate, iron, and your tears as you try to remain upright.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedHighlands = The sample contains rocks. Lots of unhappy rocks.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedDustyCrater = The sample container slips out of your hands and sinks vertically into the dust. Whoops.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedHills = The sample slips through your fingers, plummets three stories, and promptly explodes. \nButterfingers.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedGreatRift = The sample contains silicate rock and a few interesting crystals that would look great on a wedding ring. You decide to keep a few for later.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedGreatRiftDivergence = The sample contains basalt rock and tiny crystals. This is young material that formed when lava cooled on the surface very recently.
        #LOC_PW_sci_surfaceSample_OvinSrfLandedCraters = The sample contains a lot of silicate dust and pebbles. You're not sure what else you were expecting.

        // -------------------- Gurdamma --------------------

        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAbyssalOceans = The sample container implodes before you can open it. You grab a handful of ground and carry it with you instead.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedDeepOceans = Using available test tubes with you, you discover what looks to be amino acids near thermal vents. You’re reminded once again that Gurdamma is nothing more than a forming Kerbin. You are the only species in the Galaxy, besides some conspiracies that there’s a face on Duna.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedOceans = The sample contains a significant amount of CO2 and dissolved iron.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedShallows = Taking a sample, It's largely water and rocks, with a bit of proto-plasma in the mix.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedShores = The sample contains some loose metals, as well as loose rocks that are damp.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedLowlands = The sample contains an exciting mix of silicon, aluminum, iron, magnesium, calcium, sodium, potassium, and traces of organic materials.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedMidlands = The sample contains a variety of elements and compounds commonly found in Kerbin's crust.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedHighlands = The sample contains silicate, iron bands, and flakes of a dusty, crimson material that would make for a great paint base.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedMountains = The sample contains silicon and traces of oxygen.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAlpineMountains = The sample contains a large amount of volcanic rocks, but also normal rocks as well.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedPeaks = The sample contains ground rocks, as you had to dig that out of another large rock to get it to fit inside the tube.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedVolcanoes = You get a glance of obsidian when you accidentally fumble the test tube. It bounces down the slope and disappears into an open lava tube, vanishing with a sharp HISS.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedVolcanoCraters = Your scoop melts upon contact with the lava. A few drops of it fall into the sample container, so there's something to inspect at least...
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedMountBogue = The sample contains silicon dust and a small geode. You crack it open, revealing a kaleidoscope of green and white crystals. Woah!
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAshenLowlands = The sample contains major oxides and traces of sulfur, among more common terrestrial materials.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAshenHighlands = The sample contains oxides, a moderate concentration of sulfide, and flecks of ash.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAshenMountains = The sample contains a fine dust that is most likely carcinogenic. You wonder what it smells like.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAshenAlpineMountains = The sample contains a very fine ground dust along with other small amounts of brown rock.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAshenPeaks = The sample contains rock and ash from nearby volcanoes. Here the dust accumulates quicker because of the altitude and the wind.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedPoles = The sample contains loose brown and yellow rock. Doesn't look like Kulfur, but it's strangely brown and yellow.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedPolarSeas = Template
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedShankastRiver = The sample contains slime, slime, and more organic slime. We're gonna need a decontamination shower after this.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedTealRiver = The sample contains water--shocker--and nodules of organic compounds. Oh, and slime. Lots of slime.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedMylonRiver = The smell of the sample wafts through your air filter and promptly knocks you out. \n\nNote to self: sue whoever manufactures the air filters.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedFaultlines = The sample contains finely-ground rocks like cataclasite and fault gouge.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedAshenFaultlines = The sample contains finely-ground rocks, obsidian, crystals, and compressed ash.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedFaultlineShallows = The sample falls loose from your hands as the ground shakes, you have to take another one instead. Turns out the sample contains loose, white shimmery and glamerous crystals... who would have expected that!?
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedFaultlineOceans = The sample contains a mix of pressurized and crushed reflective rocks, mixed in with water and goop.
        #LOC_PW_sci_surfaceSample_GurdammaSrfLandedFaultlineTrenches = The sample contains microbial life! Weird life, but life nonetheless. This may be the greatest discovery in kerbal history!
        #LOC_PW_sci_surfaceSample_GurdammaSplashedAbyssalOcean = The sample contains super salty water with teeny specks of ash floating inside.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedDeepOceans = The sample contains super salty water with teeny specks of ash floating inside.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedOceans = The sample contains super salty water with teeny specks of ash floating inside. It's hot and warms your hand.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedShallows = The sample contains super salty water with teeny specks of ash and sand floating inside. It's hot and warms your hand.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedShores = The sample contains super salty water with teeny specks of ash and sand floating inside. It stinks of fish.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedAshenCoasts = The sample contains hot water, clouded by ash particles.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedPolarSeas = The sample contains super salty water with teeny specks of ash and sand floating inside.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedShankastRiver = The sample contains fresh water with teeny specks of ash and sand floating inside.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedTealRiver = The sample contains fresh water with teeny specks of ash and sand floating inside.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedMylonRiver = The sample contains fresh water with teeny specks of ash and sand floating inside.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedFaultlineShallows = The sample contains super salty water with organic molecules. These are the building blocks for life. We should investigate these fault lines.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedFaultlineOceans = The sample contains super salty water with organic molecules. These are the building blocks for life. We should investigate these fault lines.
        #LOC_PW_sci_surfaceSample_GurdammaSplashedFaultlineTrenches = The sample contains super salty water with organic molecules. These are the building blocks for life. We should investigate these fault lines.

        // -------------------- Donk --------------------

        #LOC_PW_sci_surfaceSample_DonkSrfLandedLavaLakes = You dip the sample tube into the lava, destroying it, your hand, and the remainder of your career.
        #LOC_PW_sci_surfaceSample_DonkSrfLandedBasaltBasins = The sample contains hardened iron and magnesium (i.e., basalt) produced by ancient lava flows.
