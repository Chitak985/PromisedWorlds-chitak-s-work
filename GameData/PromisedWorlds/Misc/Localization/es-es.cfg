        // ******** Debdeb Descriptions ********
        #LOC_PW_desc_Axod = Axod es el objeto más azul jamás descubierto por la Kerbalidad, con anillos azules y cielos azules. Lo que le falta de tamaño lo compensa con increíbles vistas y muchas lunas únicas para explorar.
        #LOC_PW_desc_Bis = Bis es el compañero helado distante de Dorau. Su superficie quebrada con manchas hace que se parezca a un Biscuit, de ahí el nombre.
        #LOC_PW_desc_Charr = Charr es un mundo fastidiado de puro hierro que se cocina en el calor intenso de Debdeb. Es probablemente el planeta más joven en el sistema y se formó del material protoplanetario del disco de escoria que rodea a Debdeb. Cuando se descubrió, los fabricantes de señales de tráfico celebraron al creer que habían encontrado una mina de oro de una pintura que brilla en la oscuridad. Pronto fueron decepcionados cuando alguien les explicó que el brillo de Charr es por el hierro fundido en su superficie, el cual ha sido comprobado previamente de ser subóptimo para la fabricación de señales de tráfico.
        #LOC_PW_desc_Debdeb = Debdeb es una estrella de secuencia principal tipo-K, ligeramente más pequeña y oscura que El Sol, dándonos un recordatorio constante que El Sol no es el centro del universo. Es una estrella joven rodeada de un disco de masa protoplanetaria, en el que algunos planetas se están formando. No se la debe mirar directamente, causa efectos similares a los de mirar al Sol, a lo que los doctores califican como "una idea estúpida".
        #LOC_PW_desc_Diros = Diros es el cuerpo más grande de su par binario, tiene un terreno impresionante con montañas y cráteres por toda la superficie, desde aquí se puede ver todo el sistema Glumo.
        #LOC_PW_desc_Donk = Se cree que Donk se formó por una colisión entre Gurdamma y otro planeta cercano, por ende el sistema de anillos en el que se está formando. Su superficie es joven, con parches de lava enfriándose por toda la superficie. Cuando se le preguntó a Nate Kerman que nombre darle a esta luna recientemente descubierta, les contó sobre un encuentro a alta velocidad entre su cabeza y la parte de arriba de la puerta del observatorio esa anterior tarde. Entonces Donk era la gran novedad espacial de la que todos hablaban.
        #LOC_PW_desc_Dorau = Dorau es una bola de nieve merodeando en las afueras del sistema Debdeb. Fue nombrado un planeta desde el día de su descubrimiento y calquiera que estuviera en desacuerdo fue echado. Su atmosfera "esponjosa" hace que se vea borroso bajo el telecopio, como una bola de algodón. Sus mejores características son sus océanos de nitrogeno líquido por la superficie. Los ingenieros Kerbal dicen que los trajes "deberían" ser capaces de tolerar un chapuzón.
        #LOC_PW_desc_Glumo = Glumo es el planeta más grande del sistema Debdeb, con un complejo sistema de anillos y nubes de muchos colores, su tamaño hace a Jool verse como un enano. Ver su vasto sistema de anillos desde sus lunas debe de ser espectacular. Ha aparecido en los álbumenes de muchas estrellas de prog rock desde su descubrimiento.
        #LOC_PW_desc_Gup = Gup es un pequeño disco de piedra con una órbita loca. Su existencia demuestra aún mas la teoría de la colisión con Gurdamma, ya que Gup probablemente es un pedazo de material eyectado, seguramente como un frisbee hacia el espacio, por ende su rápida rotación y forma plana. Su apariencia recuerda a un platillo volante, lo que llevó a multiples vergonzosos reportes de astrónomos volviéndose locos hasta la insanidad. Por favor recuerda usar un jetpack si caminas por el ecuador. La Sociedad Astrónomica Kerbal todavía no deduce su uso para juegos de frisbee espacial.
        #LOC_PW_desc_Gurdamma = La primera parada de la Kerbalidad en el sistema Debdeb. Gurdamma ofrece una mirada de como se podría haber visto Kerbin hace 4 mil millones de años, durante el periodo Kadeon. Tiene una superficie activa y cambiante, que está atravesada por cráteres de todos los tamaños, lo cual marca a un evento cósmico mayor en el pasado reciente. También hay vastos océanos de agua como en Kerbin, pero su atmósfera es tóxica con muy poco oxígeno presente. Tiene un bello sistema de anillos donde su luna más grande, Donk, se está formando. Sabiendo lo que sabemos de nuestro planeta, solo podemos predecir que futuro le espera a este planeta.
        #LOC_PW_desc_Jut = Jut es el cuerpo menor de su par binario. Se lo conoce por su apariencia de queso suizo y caótica rotación. El KSC no recomienda intentar comerlo.
        #LOC_PW_desc_KevbasAnomalyA = Un misterioso agujero de gusano al borde del sistema kerbolar. No estamos seguros de cómo llego ahí o cual es su propósito... pero, ¿por qué no capitalizar de la oportunidad del viaje interestelar barato?
        #LOC_PW_desc_KevbasAnomalyA_RSS = A mysterious wormhole discovered in the Solar system. We're not sure how it got there or what its purpose is... but why not capitalise on the opportunity for cheap interstellar travel?
        #LOC_PW_desc_KevbasAnomalyB = La entrada al sistema Debdeb, con vistas increíbles!
        #LOC_PW_desc_Kleid = Kleid parece un huevo de Kraken, se gentil si vas a aterrizar ahí.
        #LOC_PW_desc_Lapat = No te asustes por sus océanos rojo furia, Lapat es un respiro del caos del sistema interior de Debdeb. A pesar de ser mayoritariamente hielo, Lapat tiene algunas características habitables en el ecuador. Cómo consiguió su atmosfera rica en oxígeno a una edad tan temprana es un misterio, haciéndolo uno de los cuerpos mas anómalos del sistema Debdeb.
        #LOC_PW_desc_Merbel = No seas engañado por este lugar. Puede que Merbel tenga océanos, vistas increíbles y océanos paradisíacos,pero los océanos están llenos de sulfato de cobre tóxico y no hay suficiente oxígeno en el aire como para respirar, aun así es muy bonito y tiene mucho para ofrecer con un poco de intervención Kerbal. La órbita de Merbel y su tamaño sugieren que alguna vez fue un planeta independiente, a medida que Glumo se desplazó hacia el sistema exterior, Merbel fue capturado y forzado a tener una órbita inclinada. Este evento pudo tener algo que ver con los anillos espectaculares de Glumo.
        #LOC_PW_desc_Mesma = Mesma es la luna más extraña de Axod. Su superficie está dominada por planicies heladas con algunas colinas de roca por aquí y por allá. Algunos dicen que se parece a un malvavisco quemado...un malvavisco espacial... delicioso.
        #LOC_PW_desc_Noj = Noj está en un lugar raro. Debido a su miserable tamaño y precaria órbita, es casi inaccesible. Muchos la comparan con un frisbee, una piedra o un ravioli. Eso se debe a la acumulación de material en los anillos de Glumo, este proceso también ha dejado un camino a través de los anillos.
        #LOC_PW_desc_Omasa = Omasa sigue fielmente Mesma en su órbita. Omasa fue nombrada después del nombre de la mascota del astrónomo que la descubrió, quien la seguía a donde fuera su dueña. Omasa siempre está feliz, con una serie de acantilados y cráteres formando una cara feliz en un lado.
        #LOC_PW_desc_Ovin = Con una atmósfera asfixiada que come naves espaciales de desayuno, una superficie triturada con pocos lugares para aterrizar y un campo gravitacional atroz que amenaza triturar los huesos de cualquier Kerbal que se atreva a caminar por la superficie, Ovin es un planeta horrible y será un desafío colosal para la Kerbalidad. Su tamaño monstruoso y densidad nos hacen creer que es el núcleo expuesto de un gigante gaseoso que perdió su atmosfera en un evento gigante. Su descubrimiento redefinió como pensamos sobre los planetas terrestres y definitavente le dió pesadillas a muchos niños (y científicos) por muchos meses.
        #LOC_PW_desc_Rosh = Rosh es la luna más grande de Axod y su es superficie oscura como el carbón, aun así, es poco probable que exista carbon ahí. Algunos comparan sus muchas planicies al interior de una cebolla.
        #LOC_PW_desc_Shana = Shana es la luna mas vieja de Glumo, es evidente por su superficie llena de cráteres, cresta ecuatorial y mitad más oscura. La diferencia de color en las dos mitades de Shana es increíble. Su superficie tiene muchas colinas y acantilados, que se formaron de las masivas fuerzas de marea de Glumo.
        #LOC_PW_desc_Umod = Se cree que Umod se re-formó después de colisionar con otro cuerpo. Piezas de esa colisión se pueden ver en forma de los anillos de Axod.

        // Tuun Descriptions
        #LOC_PW_desc_BorgalsAnomalyA = Hasta hace poco, los científicos Kerbal pensaban que Dres era un mito. Ahora dicen que encontraron un agujero de gusano orbitándolo!
        #LOC_PW_desc_BorgalsAnomalyA_Debdeb = Encontrado en órbita de Dorau estaba este agujero de gusano. Solo hay una manera de saber con certeza a dónde lleva!
        #LOC_PW_desc_BorgalsAnomalyA_RSS = A strange wormhole recently discovered in the Solar system. Where could it lead?
        #LOC_PW_desc_BorgalsAnomalyB = Este agujero de gusano es el ticket de vuelta más rápido al sistema Kerbolar.
        #LOC_PW_desc_Puf = Puf es una extraña anomalía en el sistema Tuun. A los científicos de Kerbin les cuesta comprender cómo no está bloqueado por marea. La única conclusión es que una masiva colisión causó un cráter masivo, formando un océano muy profundo una vez se enfrió, realientizando la rotación del planeta. Puede que merezca la pena explorar lo que hay ahí abajo... Eso es... si conseguimos llegar ahí en el primer lugar.
        #LOC_PW_desc_Rask = Rask es parte de un par de Super-Kerbins bloqueados por marea que parecen volverse más y más raros cuando los miramos. Rask también fue nombrado por un rey arrogante y egoísta hace mucho tiempo. Tras muchos años de brutal combate, las guerras terminaron en un empate, destruyendo ambos lados con una sustancia conocida como Kapowda.  
        #LOC_PW_desc_RaskRuskBarycenter = Cuando el científico Jules Kerman observó Rask y Rusk con un muy telescopio muy poderoso, les recordó de la noche anterior. Así fue como los Super-Kerbins binarios fueron llamados en honor a dos grandes reyes. Al KSC le gustaría recordarte que no tienen ni idea de lo que puede pasar entre estos dos planetas, eso es, si puedes mandar algo ahí.
        #LOC_PW_desc_Rusk = Rask es parte de un par de Super-Kerbins bloqueados por marea que parecen volverse más y más raros cuando los miramos. Rusk se llama en honor a un rey que peleó comtra si vecino, Rask. Igualados en fuerza, siempre estaban buscando la ventaja en su guerra. La invención de Kapowda, y los cohetes rudimentarios, eventualmente terminaron el conflicto mediante la destrucción de ambos lados. Como sus homónimos históricos, Rask y Rusk se están destruyendo mutuamente, atrapados en una eterna espiral destructiva.
        #LOC_PW_desc_Tuun = Tuun es una estrella de secuencia principal de tipo F, conocida por ser una de las estrellas más brillantes en el cielo de Kerbin. Es el segundo vecino estelar más cercano a Kerbol. 

