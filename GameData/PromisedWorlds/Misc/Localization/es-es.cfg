        // ******** Debdeb Descriptions ********
        #LOC_PW_desc_Axod = Axod es el objecto mas azul descubierto por la Kerbalidad, con anillos azules y cielos azules. Lo que le falta de tamaño lo compensa con increibles vistas y muchas lunas unicas para explorar.
        #LOC_PW_desc_Bis = Bis es el compañero helado distante de Dorau. Su superficie quebrada con manchas Hace que se parezca a un biscuit, por eso el nombre.
        #LOC_PW_desc_Charr = Charr es un mundo jodido de puro hierro que se cocina en el calor intenso de Debdeb. Es posiblemente el planeta mas joven en el sistema y se formo del material protoplanetario del disco. Cuando se descubrio, los fabricantes de carteleras creyeron haber encontrado una mina de oro como una pintura que brilla en la oscuridad. Pronto se dieron cuenta cuando se enteraron que se debe al calor del hierro fundido en su superficie.
        #LOC_PW_desc_Debdeb = Debdeb es una estrella de secuencia principal tipo-G, ligeramente mas pequeña y oscura que El Sol, dandonos un recordatorio constante que El Sol no es el centro del universo. Es una estrella joven rodeada de un disco de masa protoplanetaria, en el que algunos planetas se estan formando. No se la debe de ver directamente, causa efectos similaresa los de mirar a El Sol, a lo que los doctores llaman "una idea estupida.s"
        #LOC_PW_desc_Diros = Diros es el cuerpo mas grande del par binario, tiene un terreno impresionante con montañas y crateres por toda la superficie, desde aqui se puede ver todo el sistema Glumo.
        #LOC_PW_desc_Donk = Se cree que Donk se formo de una colision entre Gurdamma y otro planeta cercano y el sistema de anillos en el que se forma. Su superficie es joven, con parches de lava enfriandose por toda la superficie. Cuando se le pregunto a Nate Kerman que nombre darle a esta luna recientemente descubierta, se dio un cabezaso muy veloz con la puerta del observatorio esta tarde. Entonces Donk era la novedad del observatorio.
        #LOC_PW_desc_Dorau = Dorau es una bola de nieve merodeando en las afueras del sistema Debdeb. Se lo nombro un planeta desde el dia de su descubrimiento y calquiera que estuviera en desacuerdo fue echado. Su atmosfera "esponjosa" hace que se vea borroso bajo el telecopio, como una bola de algodon. Sus mejores caracteristicas son sus oceanos de nitrogeno liquido por la superficie. Los ingenieros Kerbal dicen que los trajes "deberian" ser capaces de tolerar una nadadita.
        #LOC_PW_desc_Glumo = Glumo es el planeta mas grande del sistema Debdeb, con un complejo sistema de anillos y nubes de muchos colores, su tamaño pone a Jool como un enano. Su vasto sistema de anillos desde sus lunas debe de ser espectacular. Ha aparecido en los albumes de muchas estrellas de prog rock desde su descubrimiento.
        #LOC_PW_desc_Gup = Gup es un pequeño disco de piedra con una orbita loca. Su existencia demuestra aun mas la teoria de la colision con Gurdamma, ya que Gup probablemente es un pedazo de material eyectado, seguramente comoi un frisbee hacia el espacio, por eso su rapida rotacion y forma plana. Su apariencia recuerda a un platillo volador, lo que llevo a multiples vergonzosos reportes de astronomos volviendose locos hasta la insanidad. Por favor recuerda usar en jetpack si caminas por el ecuador. La Sociedad Astronomica Kerbal todavia no deduce su uso para juegos de frisbee-espacial.
        #LOC_PW_desc_Gurdamma = La primera parada de la Kerbalidad en el sistema Debdeb. Gurdamma ofrece una mirada de como se podria haber visto Kerbin hace 4 mil millones de años, durante el periodo Kadeon. Tiene una superficie activa y cambiante, que esta atravesada por crateres de todos los tamañon, lo cual marca a un evento cosmico mayor en el pasado reciente. Tambien hay vastos oceanos de agua como en Kerbin, pero su atmosfera es toxica con muy poco oxigeno presente. Tiene un bello sistema de anillos donde su luna mas grande, Donk, se esta formando. Sabiendo lo que sabemos de nuestro planeta, solo podemos predecir que futuro le espera a este planeta.
        #LOC_PW_desc_Jut = Jut es el cuerpo menor del par binario. Se lo conoce por su apariencia de queso suizo y caotica rotacion. El KSC no recomienda intentar comerlo.
        #LOC_PW_desc_KevbasAnomalyA = Un misterioso agujero de gusano al borde del sistema kerbolar. No estamos seguros de como llego ahi o cual es su proposito... pero por que no capitalizar de la oportunidad del viaje interestelar barato?
        #LOC_PW_desc_KevbasAnomalyB = La entrada al sistema Debdeb, con vistas increibles!
        #LOC_PW_desc_Kleid = Kleid parece un huevo de Kraken, se gentil si vas a aterrizar ahi.
        #LOC_PW_desc_Lapat = No te asustes por sus oceanos rojo furia, Lapat es un respiro del caos del sistema interior de Debdeb. A pesar de ser majoritariamente hielo, Lapat tiene algunas caracteristicas habitables en el ecuador. Como consiguio su atmosfera rica en oxigeno a una edad tan temprana es un misterio, haciendolo uno de los cuerpos mas anomalos del sistema Debdeb.
        #LOC_PW_desc_Merbel = No seas engañado por este lugar. Puede que Merbel tenga oceanos, vistas increibles y oceanos paradisiacos,pero los oceanos estan llenos de sulfacto de cobre toxico y no hay suficiente oxigeno en el aire para respirar, aun asi es muy lindo y tiene mucho para ofrecer con un poco de intervencion Kerbal. La orbita de Merbel y su tamaño sugieren que alguna vez fue un planeta independiente, a medida que Glumo se desplazan hacia el sistema exterior, Merbel fue capturado y forzado a tener una orbita inclinada. Este evento pudo tener algo que ver con los anillos espectaculares de Glumo.
        #LOC_PW_desc_Mesma = Mesma es la luna mas extraña de Axod. Su superficie esta dominada por planicies heladas con algunas colinas de roca por aqui y por alla. Algunos dicen que se parece a un malvavisco quemado...un malvavisco espacial... delicioso.
        #LOC_PW_desc_Noj = Noj esta en un lugar raro. Debido a su miserable tamaño y precaria orbita, es casi inaccesible. Muchos la comparan con un frisbee, una piedra o un ravioli. Eso se debe a la acumulacion de material en los anillos de Glumo, este proceso tambien ha dejado un camino a traves de los anillos.
        #LOC_PW_desc_Omasa = Omasa sigue fielmente Mesma en su orbita. Omasa fue nombrada despues del nombre de la mascota del astronomo que la descubrio, quien la seguiria a donde fuera su dueña. Omasa siempre esta feliz, con una serie de acantilados y crateres formando una cara feliz en un lado.
        #LOC_PW_desc_Ovin = Con una atmosfera asfixiada que come naves espaciales como desayuno, una superficie triturada con pocos lugares para aterrizar y un campo gravitacional atroz que amenaza a triturar los huesos de cualquier Kerbal que se atreva a caminar por la superficie, Ovin es un planeta horrible y sera un desafio colosal para la Kerbalidad. Su tamaño monstruoso y densidad nos hace creer que es el nucleo expuesto de un gigante gaseoso que perdio su atmosfera en un evento gigante. Su descubrimiento redifinio como pensamos sobre los planetas terrestres y definitavente le dio pesadillas a muchos niños (y cientificos) pesadillas por muchos meses.
        #LOC_PW_desc_Rosh = Rosh es la luna mas grande de Axod y su superficie oscura como el carbon, aun asi, es poco probable que exista carbon ahi. Algunos comparan sus muchas planitias al interior de una cebolla.
        #LOC_PW_desc_Shana = Shana es la luna mas vieja de Glumo, es evidente por su superficie llena de crateres, cresta ecuatorial y mitad mas oscura. La diferencia de color en las dos mitades de Shana es increible. Su superficie tiene muchas colinas y acantilados, que se formaron de las masivas fuerzas de marea de Glumo.
        #LOC_PW_desc_Umod = Se cree que Umod se re-formo despues de colisionar con otro cuerpo. Piezas de esa colision se pueden ver en forma de los anillos de Axod.

        // Tuun Descriptions
        #LOC_PW_desc_BorgalsAnomalyA = Hasta hace poco, los cientificos Kerbal pensaban que Dres era un mito. Ahora dicen que encontraron un agujero de gusano orbitandolo!
        #LOC_PW_desc_BorgalsAnomalyA_Debdeb = Found wandering around in orbit of Dorau was this wormhole. There's really only one way to find out where it goes!
        #LOC_PW_desc_BorgalsAnomalyB = This wormhole is the fastest ticket back to the Kerbol system from here.
        #LOC_PW_desc_Ixia = Ixia is the farthest and most distant ice world known to Kerbalkind, at least for now. It's extremely large, very cold, and surpasses kerbin's own gravity by more than twice as much. We've named it after a great goddess of a great mythology that once inhabited Kerbin long ago.
        #LOC_PW_desc_Puf = Puf is a rather strange anomaly in the Tuun system. Kerbin scientists struggle to figure out why it's not tidally locked. The only conclusion is that a massive collision caused a massive crater, forming a very deep ocean once cooled, and slowing the rotation down. Might be worth exploring what's down there... That is... if we can get there in the first place.
        #LOC_PW_desc_Rask = Rask is part of a pair of tidally locked together Super-Kerbins that seem to get weirder and weirder when we look at them. Rask was also named after an arrogant and selfish king long ago. The neighbouring kingdom was ruled by Rusk. After many years of brutal combat, the wars ended in a stalemate, destroying both sides with a substance known as Kapowda.
        #LOC_PW_desc_RaskRuskBarycenter = When Kerbin scientist Jules Kerman observed Rask and Rusk with a very powerful telescope, it reminded them of the night before. Alas, the binary super Kerbins are named after two great kings. The KSC would like to remind you that we have no clue what can happen between these two planets, that is if you can send something there.
        #LOC_PW_desc_Rusk = Rusk is part of a pair of tidally locked together Super-Kerbins that seem to get weirder and weirder when we look at them. Rusk is named after a King that fought his neighbour, Rask. Well-matched in strength, they were always searching for the edge in their war. The invention of Kapowda, and rudimentary rockets, eventually ended the conflict by destroying both sides. Like their mythological namesakes, Rask and Rusk are destroying each other, trapped in an endless destructive spiral.
        #LOC_PW_desc_Tuun = Tuun is a F-type main sequence star, known for being one of the brightest stars in Kerbin's sky. It's the second-closest stellar neighbour to Kerbol.
        #LOC_PW_desc_Hurr =  What we once thought to be a sensor error on one of our Telescopes, Hurr actually turns out to be orbiting Tuun! With it being reflective and as bright as it is, we can only conclude that Tuun has stripped away what once was a beautiful gas giant, and left behind its core. "Hurr" was the sound the scientists were making investigating this object, so we named it so.
        #LOC_PW_desc_Tavool = Tavool is the greatest gas giant within Tuun, and serves a beautiful display with it's purple clouds and bands. Scientists note that it's rings are fairly thick, which notes to them being new. We can only tell you this thanks to a very specialized telescope, as the Tuun system is light years away! The name of this glorious gas giant is from the father to a great goddess from one of Kerbin's mythologies, thousands of years ago.
        #LOC_PW_desc_Verda = Template.

